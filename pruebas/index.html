<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pruebas del corrector</title>
    <style>
      body { font: 14px/1.5 Consolas, monospace; margin: 24px; }
      .ok { color: #1a7f37; }
      .falla { color: #cf222e; font-weight: bold; }
      pre { margin: 0 0 0 24px; color: #57606a; }
    </style>
  </head>
  <body>
    <h1>Pruebas del corrector</h1>
    <div id="salida">Cargando el analizador...</div>

    <script type="module">
      import { cargarAnalizador } from '../js/analizador.js';
      import {
        inicio,
        corregirPaso,
        despuesDe,
        capturasPrevias,
        respuestaDeReferencia,
        programaDeOpciones,
        partesPrevias,
      } from '../js/serie.js';
      import { marcasDe, partesDeEnunciado, fichasDe, bloquesDeEnunciado, planoDe, vennDe, figuraDe, problemasDeReferencias } from '../js/enunciado.js';
      import { CASOS_DE_ENUNCIADO, resultadoDelEnunciado, CASOS_DE_PLANO, resultadoDelPlano, CASOS_DE_VENN, resultadoDelVenn } from './casos-enunciado.js';
      import { CASOS } from './casos.js';
      import { ejecutar } from '../js/simulador.js';
      import { CASOS_DEL_SIMULADOR, resultadoDelSimulador } from './casos-simulador.js';
      import { problemasDeLaTabla } from './casos-pila.js';
      import { ejecutar as ejecutarMotor } from '../js/motor/interprete.js';
      import { dibujarFotografia } from '../js/motor/figura.js';
      import { CASOS_DEL_MOTOR, resultadoDelMotor, CASOS_DE_LA_REGLA, resultadoDeLaRegla } from './casos-motor.js';
import { corregir } from '../js/corrector.js';

      const salida = document.getElementById('salida');
      const lineas = [];
      let fallas = 0;

      function anotar(bien, texto, detalle) {
        if (!bien) fallas++;
        lineas.push({ bien, texto, detalle });
      }

      
      // Un mensaje bien escrito tiene los acentos graves de a pares y nada raro
      // adentro: un par vacio, o con solo un conector, es un simbolo que se perdio.
      function mensajeBienFormado(mensaje) {
        const partes = mensaje.split('`');
        if (partes.length % 2 === 0) return false;
        // Un `y` pegado a los acentos es un nombre (la coordenada y): solo un conector con espacios es un simbolo perdido.
        return partes.every((p, i) => i % 2 === 0 || (p.trim() !== '' && ![' y ', ' o ', ' e ', ' u '].includes(p)));
      }

      const codigos = (resultado, nivel) =>
        [...new Set(resultado.diagnosticos.filter((d) => d.nivel === nivel).map((d) => d.codigo))].sort();

      try {
        const analizador = await cargarAnalizador();

        // Recorre las consignas anteriores al paso, con las respuestas dadas o
        // las de referencia, y devuelve el avance que dejan.
        function llegarHasta(serie, paso, previas = []) {
          let avance = inicio();
          for (let i = 0; i < paso - 1; i++) {
            const respuesta =
              previas[i] || respuestaDeReferencia(serie.consignas[i], capturasPrevias(serie, i, avance));
            const r = corregirPaso(analizador, serie, i, avance, respuesta);
            if (!r.correcto) {
              throw new Error(`la respuesta previa ${i + 1} no pasa: ${codigos(r, 'error')}`);
            }
            avance = despuesDe(serie, i, avance, respuesta, r);
          }
          return avance;
        }

        // Todas las series del indice: que se lean, que no repitan nombres y
        // que cada referencia pase su propia consigna.
        const indice = await (await fetch('../consignas/indice.json')).json();
        const todas = [];
        const vistos = new Set();
        const unico = (id, que) => {
          anotar(id && !vistos.has(id), `${que} con id propio: ${id}`, 'falta el id o está repetido');
          vistos.add(id);
        };
        // Los grupos: con titulo y descripcion, y cada serie en uno solo.
        const enGrupos = new Set();
        const gruposVistos = new Set();
        for (const g of indice.grupos) {
          anotar(
            Boolean(g.id && g.titulo && g.descripcion) && !gruposVistos.has(g.id),
            `grupo con id, título y descripción propios: ${g.id}`,
            'falta algo o el id está repetido'
          );
          gruposVistos.add(g.id);
          for (const archivo of g.series) {
            anotar(!enGrupos.has(archivo), `serie en un solo grupo: ${archivo}`, 'está en más de un grupo');
            enGrupos.add(archivo);
          }
        }
        const archivosOcultos = new Set(indice.grupos.flatMap((g) => (g.oculto ? g.series : g.ocultas || [])));
        const idsOcultos = new Set();
        for (const archivo of indice.grupos.flatMap((g) => g.series)) {
          try {
            const leida = await (await fetch('../consignas/' + archivo)).json();
            unico(leida.id, 'serie');
            if (archivosOcultos.has(archivo)) idsOcultos.add(leida.id);
            leida.consignas.forEach((c) => unico(c.id, 'consigna'));
            todas.push(leida);
          } catch (e) {
            anotar(false, `se lee ${archivo}`, e.message);
          }
        }

        const referencias = todas.flatMap((s) => s.consignas.map((consigna, i) => ({ s, consigna, i })));
        referencias.forEach(({ s, consigna, i }) => {
          try {
            const previo = llegarHasta(s, i + 1);
            const recibidas = capturasPrevias(s, i, previo);

            // Una consigna de opciones: una sola correcta, y cada equivocada
            // con su codigo y su explicacion. Y lo que nombra tiene que existir.
            if (consigna.opciones) {
              const correctas = consigna.opciones.filter((o) => o.correcta).length;
              const sinExplicar = consigna.opciones.filter((o) => !o.explicacion || (!o.correcta && !o.codigo));
              anotar(
                correctas === 1 && sinExplicar.length === 0 && consigna.opciones.length >= 2,
                `opciones de ${consigna.id}`,
                `${correctas} correctas; ${sinExplicar.length} opciones sin explicacion (o equivocadas sin codigo)`
              );
              const textos = [
                consigna.enunciado,
                consigna.codigo || '',
                ...consigna.opciones.flatMap((o) => [o.valor || '', o.texto, o.explicacion || '']),
              ];
              const sueltas = [...new Set(textos.flatMap(marcasDe))].filter((m) => !recibidas[m]);
              anotar(
                !sueltas.length,
                `cuestionario ${consigna.id}: nombres capturados`,
                `usa ${sueltas.map((m) => `{${m}}`).join(', ')}, que ninguna consigna anterior captura`
              );
              // El codigo se ve como un programa completo, con su main y su return.
              const programa = programaDeOpciones(s, i, previo);
              anotar(
                consigna.codigo == null || (consigna.codigo === "" && programa.trim() !== "") || (/int main\(\) \{/.test(programa) && /return 0;/.test(programa)),
                `programa de ${consigna.id}`,
                programa
              );
              const r = corregirPaso(analizador, s, i, previo, respuestaDeReferencia(consigna));
              anotar(r.correcto, `respuesta correcta de ${consigna.id}`, '');
              return;
            }

            // Una consigna con tabla de llamadas: la tabla modelo pasa, los textos estan bien
            // escritos y lo que dice la tabla es lo que hace el programa.
            if (consigna.pila) {
              const programa = programaDeOpciones(s, i, previo);
              anotar(
                /int main\(\) \{/.test(programa) && /return 0;/.test(programa),
                `programa de ${consigna.id}`,
                programa
              );
              const r = corregirPaso(analizador, s, i, previo, respuestaDeReferencia(consigna));
              anotar(r.correcto, `respuesta correcta de ${consigna.id}`, r.diagnosticos.map((d) => d.mensaje).join('\n'));
              const textos = [consigna.enunciado, consigna.explicacion || '', consigna.pila.salida?.pista || '', ...Object.values(consigna.pila.pistas || {})];
              anotar(textos.every(mensajeBienFormado), `textos de ${consigna.id}`, textos.filter((t) => !mensajeBienFormado(t)).join('\n'));
              const arbol = analizador.parse(programa);
              try {
                const salida = ejecutar(arbol, () => null, null, null, null).salida;
                const problemas = problemasDeLaTabla(consigna, salida);
                anotar(!problemas.length, `la tabla de ${consigna.id} coincide con el programa`, problemas.join('\n'));
              } catch (e) {
                anotar(false, `el programa de ${consigna.id} corre`, e.message);
              } finally {
                arbol.delete();
              }
              return;
            }

            const r = corregirPaso(analizador, s, i, previo, respuestaDeReferencia(consigna, recibidas));
            // La referencia es la respuesta modelo: correcta y sin nada que mejorar.
            anotar(
              r.correcto && !r.mejorable,
              `referencia de ${consigna.id}`,
              [...codigos(r, 'error'), ...codigos(r, 'mejora')].join(', ')
            );

            // Un {X} del enunciado tiene que haberlo capturado una consigna anterior.
            // Solo cuentan las capturas que la consigna recibe: si no continua,
            // un {S} no tiene de donde salir.
            const sueltas = marcasDe(consigna.enunciado).filter((marca) => !recibidas[marca]);
            if (marcasDe(consigna.enunciado).length) {
              anotar(
                !sueltas.length,
                `enunciado de ${consigna.id}: nombres capturados`,
                `usa ${sueltas.map((m) => `{${m}}`).join(', ')}, que ninguna consigna anterior captura`
              );
            }
            // Una ficha (o varias): sus campos son los de la estructura que se
            // corrige (lo que se ve es lo que se corrige), y los valores que la
            // consigna pide cargar estan en el enunciado.
            const fichas = fichasDe(consigna);
            if (fichas.length) {
              const pedidos = (consigna.requiere || [])
                .flatMap((r) => (r.struct ? r.struct.campos.map((c) => c.nombre) : []))
                .sort();
              if (pedidos.length) {
                const nombres = fichas[0].campos.map((c) => c.nombre).sort();
                anotar(
                  nombres.join() === pedidos.join(),
                  `ficha de ${consigna.id}: campos`,
                  `la ficha muestra ${nombres.join(', ')} y la regla pide ${pedidos.join(', ')}`
                );
              }
              // Una regla "campo" corrige contra el ejemplo de la ficha.
              // Los campos de adentro de otra estructura se miran con su camino.
              const hojas = (campos, prefijo = '') =>
                campos.flatMap((c) =>
                  c.campos ? hojas(c.campos, `${prefijo}${c.nombre}.`) : [{ ...c, ruta: `${prefijo}${c.nombre}` }]
                );
              const conEjemplo = fichas.flatMap((f) => hojas(f.campos)).filter((c) => c.ejemplo != null);
              const guardados = (consigna.requiere || []).flatMap((r) =>
                r.campo ? r.campo.campos.map((c) => c.nombre) : []
              );
              const sinEjemplo = guardados.filter((n) => !conEjemplo.some((c) => c.nombre === n));
              anotar(
                !sinEjemplo.length,
                `ficha de ${consigna.id}: valores que se corrigen`,
                `la regla "campo" pide ${sinEjemplo.join(', ')}, que la ficha no muestra con ejemplo`
              );
              // Lo que la consigna pide cargar (los campos resaltados) tiene su valor escrito.
              const sinDecir = [];
              for (const f of fichas) {
                if (!Array.isArray(f.resaltar)) continue;
                for (const campo of hojas(f.campos)) {
                  if (f.resaltar.includes(campo.ruta) && campo.ejemplo != null) {
                    const escrito = consigna.enunciado.replace(/[`'"]/g, '');
                    if (!escrito.includes(String(campo.ejemplo))) sinDecir.push(campo.ruta);
                  }
                }
              }
              anotar(
                !sinDecir.length,
                `ficha de ${consigna.id}: valores en el enunciado`,
                `el enunciado no dice el valor de ${sinDecir.join(', ')}, que la ficha resalta`
              );
            }
          } catch (e) {
            anotar(false, `referencia de ${consigna.id}`, e.message);
          }
        });

        // Una consigna que "parteDe" otra ve el codigo que esa veia, sin las
        // respuestas que vinieron en el medio.
        for (const s of todas) {
          s.consignas.forEach((consigna, i) => {
            if (!consigna.parteDe) return;
            const origen = s.consignas.findIndex((c) => c.id === consigna.parteDe);
            if (origen < 0 || origen >= i) {
              anotar(false, `parteDe de ${consigna.id}`, `"${consigna.parteDe}" tiene que ser una consigna anterior`);
              return;
            }
            try {
              const delOrigen = partesPrevias(s, origen, llegarHasta(s, origen + 1)).main;
              const propio = partesPrevias(s, i, llegarHasta(s, i + 1)).main;
              const respuestas = s.consignas
                .slice(origen, i)
                .filter((c) => !c.opciones && !c.pila)
                .map((c) => respuestaDeReferencia(c, {}))
                .filter((r) => r && !delOrigen.includes(r));
              const colada = respuestas.find((r) => propio.includes(r));
              anotar(
                propio.startsWith(delOrigen) && !colada,
                `parteDe de ${consigna.id}: el código que ve es el de ${consigna.parteDe}`,
                colada ? `se cuela la respuesta "${colada}"` : 'no empieza con el código de esa consigna'
              );
            } catch (e) {
              anotar(false, `parteDe de ${consigna.id}`, e.message);
            }
          });
        }

        // El enunciado muestra el nombre solo, venga de una etiqueta o de un alias.
        const armado = (enunciado, capturas) =>
          partesDeEnunciado(enunciado, capturas)
            .map((p) => p.nombre ?? p.texto)
            .join('');
        const ENUNCIADOS = [
          ['la estructura {S}.', { S: 'struct Alumno' }, 'la estructura Alumno.'],
          ['la estructura {S}.', { S: 'Alumno' }, 'la estructura Alumno.'],
          ['{S} y su alias {A}', { S: 'struct Local', A: 'TLocal' }, 'Local y su alias TLocal'],
          ['sin capturar: {X}', { S: 'struct Local' }, 'sin capturar: {X}'],
        ];
        for (const [enunciado, capturas, esperado] of ENUNCIADOS) {
          const salio = armado(enunciado, capturas);
          anotar(salio === esperado, `enunciado: "${enunciado}"`, `esperaba "${esperado}"\nsalió   "${salio}"`);
        }

        // El simulador, sin pasar por una consigna.
        // Una ficha de arreglo se abre en una por elemento.
        {
          const abiertas = fichasDe({
            ficha: {
              arreglo: 'alumnos',
              campos: ['legajo', 'promedio'],
              elementos: [[1, '8.50'], null],
              destacar: [1],
              resaltar: ['promedio'],
              leyenda: 'Asi:',
            },
          });
          const bien =
            abiertas.length === 2 &&
            abiertas[0].titulo === 'alumnos[0]' &&
            abiertas[0].leyenda === 'Asi:' &&
            abiertas[0].disposicion === 'fila' &&
            abiertas[0].campos[1].ejemplo === '8.50' &&
            abiertas[1].titulo === 'alumnos[1]' &&
            abiertas[1].campos[0].ejemplo === undefined &&
            abiertas[1].destacar === true &&
            abiertas[0].destacar === false;
          anotar(bien, 'ficha de un arreglo: una por elemento', JSON.stringify(abiertas));
        }

        {
          const problemas = problemasDeReferencias(todas, idsOcultos);
          anotar(!problemas.length, 'referencias entre consignas: apuntan a algo que existe', problemas.join('\n'));
          const prueba = problemasDeReferencias(
            [{ id: 'a', consignas: [{ id: 'x', enunciado: 'ver [[b#y]] y [[b#nada]] y [[c#z]]' }] }, { id: 'b', consignas: [{ id: 'y' }] }, { id: 'c', consignas: [{ id: 'z' }] }],
            new Set(['c'])
          );
          anotar(prueba.length === 2 && /b#nada/.test(prueba[0]) && /oculta/.test(prueba[1]), 'referencias entre consignas: se avisan las que no existen y las que llevan a una oculta', JSON.stringify(prueba));
        }

        for (const caso of CASOS_DE_ENUNCIADO) {
          const r = resultadoDelEnunciado(bloquesDeEnunciado, caso);
          anotar(r.bien, `enunciado: ${caso.nombre}`, r.detalle);
        }

        for (const caso of CASOS_DE_PLANO) {
          const r = resultadoDelPlano(planoDe, caso);
          anotar(r.bien, `plano: ${caso.nombre}`, r.detalle);
        }

        for (const caso of CASOS_DE_VENN) {
          const r = resultadoDelVenn(vennDe, caso);
          anotar(r.bien, `venn: ${caso.nombre}`, r.detalle);
        }

        // Los dibujos con plano de las series se arman sin error.
        for (const s of todas) {
          for (const c of s.consignas.filter((c) => c.dibujo && (c.dibujo.plano || c.dibujo.venn || Array.isArray(c.dibujo)))) {
            try {
              figuraDe(c);
              anotar(true, `dibujo de ${c.id}`);
            } catch (e) {
              anotar(false, `dibujo de ${c.id}`, e.message);
            }
          }
        }

        for (const caso of CASOS_DEL_SIMULADOR) {
          const r = resultadoDelSimulador(analizador, ejecutar, caso);
          anotar(r.bien, `simulador: ${caso.nombre}`, r.detalle);
        }

        for (const caso of CASOS_DEL_MOTOR) {
          const r = resultadoDelMotor(analizador, ejecutarMotor, caso);
          anotar(r.bien, `motor: ${caso.nombre}`, r.detalle);
        }
        // La figura se dibuja en todos los pasos de todos los programas, sin fallar.
        for (const caso of CASOS_DEL_MOTOR) {
          try {
            const r = ejecutarMotor(analizador, caso.codigo, { entrada: caso.entrada, traza: true });
            r.traza.forEach((foto, i) => dibujarFotografia(foto, i ? r.traza[i - 1] : null));
            anotar(true, `figura del motor: ${caso.nombre}`);
          } catch (e) {
            anotar(false, `figura del motor: ${caso.nombre}`, e.stack);
          }
        }

        // Con la ayuda "Punteros sin inicializar" la figura tambien se dibuja en todos los pasos (con las animaciones de un paso al otro), y un
        // puntero que nunca recibio una direccion lleva una flecha hacia un "?"; sin la ayuda, su casilla dice "?".
        {
          const titulo = 'figura: punteros sin inicializar (con y sin la ayuda)';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            let flechas = 0;
            for (const caso of CASOS_DEL_MOTOR) {
              const r = ejecutarMotor(analizador, caso.codigo, { entrada: caso.entrada, traza: true });
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas({ punterosSinValor: true });
              r.traza.forEach((foto, i) => {
                figura.mostrar(foto, i ? r.traza[i - 1] : null, { animar: false });
                flechas += figura.svg.querySelectorAll('.rep-flecha-incierta').length;
              });
            }
            if (flechas === 0) throw new Error('ningun puntero sin direccion se dibujo con su flecha');
            const fuente = 'int main() {\n  int *p;\n  int *q = p;\n  return 0;\n}';
            const m = ejecutarMotor(analizador, fuente, { traza: true });
            // (la ultima fotografia ya no tiene la caja de main: se usa la anterior, con las dos variables declaradas)
            const ultima = m.traza[m.traza.length - 2];
            const contar = (ayuda) => {
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas({ punterosSinValor: ayuda });
              figura.mostrar(ultima, m.traza[m.traza.length - 3], { animar: false });
              return { flechas: figura.svg.querySelectorAll('.rep-flecha-incierta').length, signos: [...figura.svg.querySelectorAll('text')].filter((t) => t.textContent === '?').length };
            };
            const con = contar(true);
            const sin = contar(false);
            if (con.flechas !== 2 || sin.flechas !== 0) throw new Error('flechas con la ayuda: ' + con.flechas + ', sin la ayuda: ' + sin.flechas + ' (se esperaban 2 y 0)');
            if (sin.signos !== 2) throw new Error('sin la ayuda cada casilla debe decir "?": ' + sin.signos);
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // El "?" es de lo que no se sabe (magenta, tambien cuando la flecha aparece o se retira); la "×" roja es de lo que ya no esta.
        {
          const titulo = 'figura: "?" magenta para lo que no se sabe y "×" roja para lo que ya no esta';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('explicacion');
            const pasos = (fuente, animar = true) => {
              const m = ejecutarMotor(analizador, fuente, { traza: true });
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              const salida = [];
              m.traza.forEach((foto, i) => {
                figura.mostrar(foto, i ? m.traza[i - 1] : null, { animar: animar && Boolean(i), duracion: 1000, flujo: false });
                if (figura.raf) cancelAnimationFrame(figura.raf);
                const textos = [...figura.svg.querySelectorAll('text')].map((t) => t.textContent);
                const inciertas = [...figura.svg.querySelectorAll('.rep-flecha.rep-flecha-incierta')];
                salida.push({
                  cruces: textos.filter((t) => t === '×').length,
                  signos: figura.svg.querySelectorAll('.rep-incierto-texto').length,
                  cabezasMagenta: inciertas.every((p) => p.getAttribute('marker-end') === 'url(#rep-punta-incierta)'),
                  inciertas: inciertas.length,
                  grosor: figura.svg.querySelectorAll('.rep-flecha-g.rep-nueva .rep-flecha-incierta, .rep-flecha-g.rep-retirada .rep-flecha-incierta').length,
                });
              });
              return salida;
            };
            const dice = (cond, mensaje) => {
              if (!cond) throw new Error(mensaje);
            };
            let e = pasos('int main() {\n  int *p;\n  p = NULL;\n  return 0;\n}');
            dice(e.some((x) => x.inciertas > 0), 'el puntero sin direccion debe llevar su flecha al "?"');
            dice(e.every((x) => x.cabezasMagenta), 'la cabeza de la flecha del "?" (nueva o retirada) tiene que ser magenta');
            dice(e.some((x) => x.grosor > 0), 'la flecha del "?" que aparece o se retira se engrosa, sin cambiar de color');
            dice(e.every((x) => x.cruces === 0), 'sin punteros a algo que ya no esta no debe haber "×"');
            // (ya dibujado, sin animar: mientras se anima la flecha que sale de un "?", este se desvanece a su lado)
            e = pasos('int *f() {\n  int x = 1;\n  return &x;\n}\nint main() {\n  int *p = f();\n  return 0;\n}', false);
            dice(e.some((x) => x.cruces > 0), 'un puntero a una variable que ya no existe termina en una "×"');
            dice(e.filter((x) => x.cruces > 0).every((x) => x.signos === 0), 'la flecha roja punteada no lleva el "?" magenta');
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Que se contrae y que se desvanece: la flecha de un puntero que sigue ahi y deja de apuntar (a NULL) se contrae hasta su casilla; la
        // de un puntero que desaparece (termina su funcion, o el bloque donde estaba declarado) se desvanece, junto con su casilla. Un puntero
        // sin direccion que recibe una (o pasa de NULL a una) redirige su flecha; si pasa a NULL, la contrae.
        {
          const titulo = 'figura: las flechas se contraen o se desvanecen segun lo que pasa con el puntero';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('explicacion');
            const escenas = (fuente) => {
              const m = ejecutarMotor(analizador, fuente, { traza: true });
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              const salida = [];
              m.traza.forEach((foto, i) => {
                figura.mostrar(foto, i ? m.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: false });
                if (figura.raf) cancelAnimationFrame(figura.raf);
                salida.push({ retiradas: figura.escena.retiradas, flechas: figura.escena.flechas, desvanecen: figura.escena.desvanecen.length });
              });
              return salida;
            };
            const dice = (cond, mensaje) => {
              if (!cond) throw new Error(mensaje);
            };
            let e = escenas('int main() {\n  int n = 1;\n  int *p = &n;\n  p = NULL;\n  return 0;\n}');
            dice(e[3].retiradas.length === 1 && !e[3].retiradas[0].seVa && e[3].retiradas[0].haciaNulo, 'p = NULL: la flecha se tiene que contraer y dar paso a NULL');
            e = escenas('#include <stdlib.h>\nint main() {\n  int *p = malloc(sizeof(int));\n  *p = 1;\n  free(p);\n  p = NULL;\n  return 0;\n}');
            dice(e[4].retiradas.length === 1 && !e[4].retiradas[0].seVa && e[4].retiradas[0].haciaNulo, 'free(p); p = NULL: la flecha roja tambien se contrae');
            e = escenas('void f(int *q) {\n  *q = 2;\n}\nint main() {\n  int n = 1;\n  int *p = &n;\n  f(p);\n  return 0;\n}');
            dice(e.some((x) => x.retiradas.some((r) => r.seVa && !r.haciaNulo)), 'al terminar una funcion la flecha de su caja se desvanece');
            e = escenas('int main() {\n  int n = 1;\n  {\n    int *p = &n;\n    *p = 2;\n  }\n  return 0;\n}');
            dice(e[3].retiradas.length === 1 && e[3].retiradas[0].seVa, 'al terminar un bloque la flecha de su puntero se desvanece');
            dice(e[3].desvanecen >= 1, 'al terminar un bloque la casilla del puntero tambien se desvanece');
            e = escenas('int main() {\n  int n = 1;\n  int *p;\n  p = &n;\n  return 0;\n}');
            dice(e[3].flechas.some((f) => f.desdeIncierto && f.viejo), 'un puntero sin direccion que recibe una: la flecha se redirige desde el "?"');
            e = escenas('int main() {\n  int *p;\n  p = NULL;\n  return 0;\n}');
            dice(e[2].retiradas.some((r) => r.incierta && r.haciaNulo && !r.seVa), 'un puntero sin direccion que pasa a NULL: la flecha al "?" se contrae');
            e = escenas('int main() {\n  int n = 1;\n  int *p = NULL;\n  p = &n;\n  return 0;\n}');
            dice(e[3].flechas.some((f) => f.desdeNulo), 'un puntero que pasa de NULL a una direccion: la palabra da paso al punto');
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Lo que sale de su ambito va despues del efecto de la sentencia: en el paso en que una sentencia hace algo y a la vez termina un
        // bloque o una funcion, la figura primero muestra el efecto con lo que va a salir todavia en su lugar (la variable del bloque, la caja
        // de la funcion) y deja el desvanecimiento para el paso encadenado.
        {
          const titulo = 'figura: el desvanecimiento de lo que sale va despues del efecto de la sentencia';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            const { tiempo } = await import('../js/motor/tiempo.js');
            ajustes.fijarPerfil('explicacion');
            const encadenado = (fuente, buscar) => {
              const m = ejecutarMotor(analizador, fuente, { traza: true });
              const i = m.traza.findIndex((foto, k) => k > 0 && buscar(foto, m.traza[k - 1]));
              if (i < 1) throw new Error('no se encontro el paso');
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              for (let k = 0; k < i; k++) figura.mostrar(m.traza[k], k ? m.traza[k - 1] : null, { animar: false });
              figura.mostrar(m.traza[i], m.traza[i - 1], { animar: true, duracion: 1000, flujo: true });
              const pendiente = Boolean(figura.expansionPendiente);
              const nombres = [...figura.escena.svg.querySelectorAll('.rep-nombre, .rep-funcion')].map((t) => t.textContent);
              tiempo.cancelar(figura.expansionPendiente);
              if (figura.raf) cancelAnimationFrame(figura.raf);
              return { pendiente, nombres, foto: m.traza[i] };
            };
            let r = encadenado(
              '#include <stdlib.h>\ntypedef struct nodo { int d; struct nodo *sig; } Nodo;\nint main() {\n  Nodo *lista = malloc(sizeof(Nodo));\n  lista->sig = NULL;\n  Nodo *nuevo = malloc(sizeof(Nodo));\n  nuevo->sig = NULL;\n  {\n    Nodo *p = lista;\n    p->sig = nuevo;\n  }\n  return 0;\n}',
              (foto, antes) => foto.marcos[0] && antes.marcos[0] && foto.marcos[0].variables.length < antes.marcos[0].variables.length
            );
            if (!r.pendiente) throw new Error('el paso del bloque que termina deberia encadenar el efecto y el desvanecimiento');
            if (!r.nombres.includes('p')) throw new Error('mientras se ve el efecto, la variable p todavia tiene que estar: ' + r.nombres.join(','));
            r = encadenado(
              '#include <stdlib.h>\nint *crear() {\n  int *q = malloc(sizeof(int));\n  return q;\n}\nint main() {\n  int *p = crear();\n  free(p);\n  return 0;\n}',
              (foto, antes) => foto.marcos.length < antes.marcos.length
            );
            if (!r.pendiente) throw new Error('el paso en que termina una funcion deberia encadenar el efecto y el desvanecimiento');
            if (!r.nombres.includes('crear()')) throw new Error('mientras se ve el efecto, la caja de la funcion todavia tiene que estar: ' + r.nombres.join(','));
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Una flecha cuyo destino se va (la variable de una funcion o de un bloque que termina): primero se ve que el puntero la alcanza,
        // despues se desvanece lo que se va y al final la flecha retrocede hasta la "×".
        {
          const titulo = 'figura: la flecha cuyo destino se va llega a el, lo ve desvanecerse y retrocede hacia la "×"';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            const { tiempo } = await import('../js/motor/tiempo.js');
            ajustes.fijarPerfil('explicacion');
            const dosTiempos = (fuente, buscar) => {
              const m = ejecutarMotor(analizador, fuente, { traza: true });
              const i = m.traza.findIndex((foto, k) => k > 0 && buscar(foto, m.traza[k - 1]));
              if (i < 1) throw new Error('no se encontro el paso');
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              for (let k = 0; k < i; k++) figura.mostrar(m.traza[k], k ? m.traza[k - 1] : null, { animar: false });
              figura.mostrar(m.traza[i], m.traza[i - 1], { animar: true, duracion: 1000, flujo: true });
              const primero = { hay: Boolean(figura.expansionPendiente), flechas: figura.escena.flechas.filter((f) => f.cambio && f.final && f.final.tipo !== 'perdida').length, cruces: [...figura.escena.svg.querySelectorAll('text')].filter((t) => t.textContent === '×').length, rojos: figura.escena.svg.querySelectorAll('.rep-muerto, .rep-flecha-liberada, [marker-end="url(#rep-punta-mala)"]').length, textos: [...figura.escena.svg.querySelectorAll('text')].map((t) => t.textContent) };
              // el segundo tiempo, a mano
              tiempo.cancelar(figura.expansionPendiente);
              if (figura.raf) cancelAnimationFrame(figura.raf);
              figura.mostrar(m.traza[i], figura.intermediaFoto, { animar: true, duracion: 1000, flujo: false, expandir: false, bloquePrimero: false, salidaDespues: false });
              if (figura.raf) cancelAnimationFrame(figura.raf);
              const escena = figura.escena;
              const muestras = [0, 0.2, 0.45, 0.6, 0.8, 1].map((k) => {
                figura.animandoA = true;
                figura.kA = k;
                figura.fase = 'A';
                figura.pintarFlechas();
                const svg = escena.svg;
                return {
                  k,
                  velo: escena.desvanecen.map((d) => Number(d.g.style.opacity)),
                  ambar: svg.querySelectorAll('.rep-flecha-g.rep-nueva').length,
                  continuas: svg.querySelectorAll('.rep-flecha-liberada').length,
                  rojas: svg.querySelectorAll('.rep-flecha-mala').length,
                  cruces: [...svg.querySelectorAll('text')].filter((t) => t.textContent === '×').length,
                };
              });
              figura.animandoA = false;
              return { primero, muestras, destinoSeVa: escena.destinoSeVa };
            };
            let r = dosTiempos(
              'int *crear() {\n  int x = 7;\n  return &x;\n}\nint main() {\n  int *c = crear();\n  return 0;\n}',
              (foto, antes) => foto.marcos.length < antes.marcos.length
            );
            if (!r.primero.hay) throw new Error('el paso en que la funcion termina y el puntero recibe &x deberia encadenarse');
            if (r.primero.flechas < 1) throw new Error('primero la flecha tiene que llegar a x (todavia esta la caja de la funcion)');
            if (r.primero.cruces) throw new Error('mientras la caja sigue ahi no puede haber una "×"');
            if (r.primero.rojos) throw new Error('mientras x sigue ahi, la flecha, su punta y su punto no son rojos (son de lo que llega): ' + r.primero.rojos);
            if (!r.destinoSeVa) throw new Error('en el segundo tiempo la flecha de c es la de un destino que se va');
            const [m0, m1, m2, m3, m4, m5] = r.muestras;
            if (!(m0.velo.every((v) => v === 1) && m0.ambar === 0 && m0.continuas >= 1 && m0.rojas === 0 && m0.cruces === 0)) throw new Error('al empezar: la caja entera, la flecha ya roja (continua, no ambar), sin cruz: ' + JSON.stringify(m0));
            if (!m2.velo.every((v) => v < 0.1)) throw new Error('hacia el 45 %: la caja ya se desvanecio: ' + JSON.stringify(m2));
            if (!(m3.rojas >= 1 && m3.continuas >= 1)) throw new Error('retrocediendo: la roja continua y la roja punteada se cruzan: ' + JSON.stringify(m3));
            if (!(m5.rojas >= 1 && m5.cruces >= 1)) throw new Error('al terminar: roja punteada con su cruz: ' + JSON.stringify(m5));
            // un bloque que termina con el puntero ya asignado (el paso es solo "y = 4;" mas el fin del bloque)
            r = dosTiempos(
              'int main() {\n  int *b = NULL;\n  {\n    int y = 3;\n    b = &y;\n    y = 4;\n  }\n  return 0;\n}',
              (foto, antes) => foto.marcos[0] && antes.marcos[0] && foto.marcos[0].variables.length < antes.marcos[0].variables.length
            );
            if (!r.primero.hay) throw new Error('el paso en que termina el bloque deberia encadenarse');
            if (!r.primero.textos.includes('4') || r.primero.textos.includes('3')) throw new Error('y = 4; se ve antes de que y se vaya (y vale 4, ya no 3): ' + r.primero.textos.join(','));
            if (r.primero.rojos) throw new Error('mientras y sigue ahi, la flecha de b no es roja: ' + r.primero.rojos);
            if (!r.destinoSeVa) throw new Error('al terminar el bloque la flecha de b es la de un destino que se va');
            if (!r.muestras[2].velo.length || !r.muestras[2].velo.every((v) => v < 0.1)) throw new Error('la variable y tiene que desvanecerse: ' + JSON.stringify(r.muestras[2]));
            if (!(r.muestras[5].rojas >= 1 && r.muestras[5].cruces >= 1)) throw new Error('al terminar: roja punteada con su cruz');
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Los exámenes resueltos (examenes/*.json, ver js/examenes.js): cada uno tiene la forma que espera la página, cada solución de un
        // módulo está escrita igual dentro del programa que se ve paso a paso, y el programa corre en el motor con su entrada y muestra lo
        // que dice "salida".
        {
          const titulo = 'exámenes resueltos: la forma de los archivos y que cada programa corra y muestre lo esperado';
          try {
            // El formato del codigo de los examenes (para que los alumnos identifiquen rapido cada parte): una linea en blanco entre
            // las funciones y despues de cada bloque cerrado, antes de cada estructura de control (salvo la primera de su bloque) y antes
            // del return; ninguna justo despues de abrir una llave ni justo antes de cerrarla; vacias de verdad (sin espacios).
            const faltasDeFormato = (codigo) => {
              const lineas = codigo.split('\n');
              const faltas = [];
              lineas.forEach((l, i) => {
                const n = i + 1;
                const t = l.trim();
                const antes = i ? lineas[i - 1] : null;
                const despues = i + 1 < lineas.length ? lineas[i + 1] : null;
                if (l !== '' && t === '') faltas.push('línea ' + n + ': una línea en blanco va vacía, sin espacios');
                if (t !== '' && l !== l.trimEnd()) faltas.push('línea ' + n + ': espacios al final');
                if (l === '' && antes === '') faltas.push('línea ' + n + ': dos líneas en blanco seguidas');
                if (l === '' && antes !== null && antes.trimEnd().endsWith('{')) faltas.push('línea ' + n + ': en blanco justo después de abrir una llave');
                if (l === '' && despues !== null && despues.trim().startsWith('}')) faltas.push('línea ' + n + ': en blanco justo antes de cerrar una llave');
                if (/^(if|for|while|do|switch)\b/.test(t) && antes !== null && antes !== '' && !antes.trimEnd().endsWith('{')) faltas.push('línea ' + n + ': la estructura de control va separada de lo anterior por una línea en blanco');
                if (t === '}' && despues !== null && despues !== '' && !despues.trim().startsWith('}')) faltas.push('línea ' + n + ': después de cerrar un bloque va una línea en blanco');
                if (/^return\b/.test(t) && antes !== null && antes !== '' && !antes.trimEnd().endsWith('{')) faltas.push('línea ' + n + ': el return va separado de lo anterior por una línea en blanco');
              });
              return faltas;
            };
            const indice = await (await fetch('../examenes/indice.json')).json();
            if (!Array.isArray(indice.examenes) || !indice.examenes.length) throw new Error('indice.json: falta la lista "examenes"');
            const ids = new Set();
            for (const archivo of indice.examenes) {
              const e = await (await fetch('../examenes/' + archivo)).json();
              const donde = archivo + ': ';
              for (const campo of ['id', 'titulo', 'fecha']) if (!e[campo]) throw new Error(donde + 'falta ' + campo);
              if (ids.has(e.id)) throw new Error(donde + 'id repetido ' + e.id);
              ids.add(e.id);
              if (archivo !== e.id + '.json') throw new Error(donde + 'el archivo tiene que llamarse como su id (' + e.id + '.json)');
              if (!/^\d{4}-\d{2}-\d{2}$/.test(e.fecha) || (e.visibleDesde && !/^\d{4}-\d{2}-\d{2}$/.test(e.visibleDesde))) throw new Error(donde + 'las fechas van como AAAA-MM-DD');
              if (!Array.isArray(e.ejercicios) || !e.ejercicios.length) throw new Error(donde + 'sin ejercicios');
              const idsDeEjercicio = new Set();
              for (const x of e.ejercicios) {
                const en = donde + (x.id || '?') + ': ';
                for (const campo of ['id', 'titulo', 'enunciado', 'programa']) if (!x[campo]) throw new Error(en + 'falta ' + campo);
                if (!Number.isInteger(x.puntos) || x.puntos <= 0) throw new Error(en + 'los puntos son un entero positivo');
                if (idsDeEjercicio.has(x.id)) throw new Error(en + 'id de ejercicio repetido');
                idsDeEjercicio.add(x.id);
                if (!Array.isArray(x.modulos) || !x.modulos.length) throw new Error(en + 'sin módulos');
                for (const mod of x.modulos) {
                  for (const campo of ['id', 'titulo', 'enunciado', 'solucion']) if (!mod[campo]) throw new Error(en + 'un módulo sin ' + campo);
                  if (!x.programa.includes(mod.solucion)) throw new Error(en + 'la solución del módulo ' + mod.id + ' no está escrita igual en el programa que se ejecuta');
                  const mal = faltasDeFormato(mod.solucion);
                  if (mal.length) throw new Error(en + 'el código del módulo ' + mod.id + ' no sigue el formato: ' + mal.slice(0, 3).join('; '));
                }
                const malPrograma = faltasDeFormato(x.programa);
                if (malPrograma.length) throw new Error(en + 'el programa no sigue el formato: ' + malPrograma.slice(0, 3).join('; '));
                const suma = x.modulos.reduce((s, mod) => s + (mod.puntos || 0), 0);
                if (suma !== x.puntos) throw new Error(en + 'los puntos de los módulos suman ' + suma + ' y el ejercicio dice ' + x.puntos);
                for (const d of x.dibujos || []) if (!Array.isArray(d.valores)) throw new Error(en + 'un dibujo sin valores');
                if (x.resumen != null && typeof x.resumen !== 'string') throw new Error(en + 'el resumen es un texto');
                const r = ejecutarMotor(analizador, x.programa, { entrada: x.entrada || '', traza: true });
                if (r.error) throw new Error(en + 'el programa no corre: ' + (r.error.codigo || '') + ' ' + (r.error.mensaje || ''));
                if (!r.traza.length) throw new Error(en + 'el programa no tiene nada que seguir');
                const salida = r.traza[r.traza.length - 1].salida;
                if (x.salida != null && salida !== x.salida) throw new Error(en + 'la salida es ' + JSON.stringify(salida) + ' y se esperaba ' + JSON.stringify(x.salida));
              }
            }
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // El trazado de las llamadas recursivas y la figura se turnan: en un programa sin memoria dinamica cuyo main declara algo, la tabla se ve
        // mientras se ejecuta la recursion (desde que se entra a la primera llamada hasta que vuelve la de mas afuera) y la figura el resto; si el
        // main no declara nada, la tabla se ve siempre; con memoria dinamica, las dos a la vez; con la ayuda apagada, solo la figura.
        {
          const titulo = 'trazado: la tabla y la figura se turnan segun el paso';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('explicacion');
            const recursiva = 'int factorial(int n) {\n  if (n <= 1) {\n    return 1;\n  }\n\n  return n * factorial(n - 1);\n}\n';
            const modos = (fuente) => {
              const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true });
              const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, llamadas: m.llamadas });
              return { m, rep, cadena: m.traza.map((f, k) => (rep.modoDelPaso(k).tabla ? 'T' : '') + (rep.modoDelPaso(k).figura ? 'F' : '')) };
            };
            // main con variables: figura, tabla durante la recursion, figura
            let r = modos('#include <stdio.h>\n\n' + recursiva + '\nint main() {\n  int a = 3;\n  int r = factorial(a);\n\n  printf("%d\\n", r);\n\n  return 0;\n}');
            const [primera] = r.m.llamadas;
            const esperado = r.m.traza.map((f, k) => (k >= primera.desde && k < primera.hasta ? 'T' : 'F'));
            if (r.cadena.join(',') !== esperado.join(',')) throw new Error('con variables en main: ' + r.cadena.join(',') + ' y se esperaba ' + esperado.join(','));
            if (!r.cadena.includes('F') || !r.cadena.includes('T')) throw new Error('tienen que verse las dos');
            // dos recursiones separadas: la figura vuelve entre ambas
            r = modos('#include <stdio.h>\n\n' + recursiva + '\nint main() {\n  int a = factorial(2);\n  int b = factorial(3);\n\n  printf("%d %d\\n", a, b);\n\n  return 0;\n}');
            const tramos = r.cadena.join('').replace(/F+/g, 'F').replace(/T+/g, 'T');
            if (tramos !== 'FTFTF') throw new Error('dos recursiones: ' + tramos + ' (se esperaba FTFTF)');
            // main sin nada que mostrar: la tabla siempre
            r = modos('#include <stdio.h>\n\n' + recursiva + '\nint main() {\n  printf("%d\\n", factorial(3));\n\n  return 0;\n}');
            if (!r.cadena.every((x) => x === 'T')) throw new Error('main sin variables: la tabla se ve siempre: ' + r.cadena.join(','));
            // con memoria dinamica: las dos a la vez
            r = modos(
              '#include <stdio.h>\n#include <stdlib.h>\n\nint suma(int *v, int n) {\n  if (n == 0) {\n    return 0;\n  }\n\n  return v[n - 1] + suma(v, n - 1);\n}\n\nint main() {\n  int *v = malloc(2 * sizeof(int));\n  int s;\n\n  v[0] = 4;\n  v[1] = 5;\n  s = suma(v, 2);\n  printf("%d\\n", s);\n  free(v);\n\n  return 0;\n}'
            );
            const dosALaVez = r.cadena.slice(r.m.llamadas[0].desde, r.m.llamadas[0].hasta);
            if (!dosALaVez.every((x) => x === 'TF')) throw new Error('con memoria dinamica se ven las dos: ' + dosALaVez.join(','));
            // entre dos recursiones la tabla se limpia: solo las llamadas del tramo del paso
            r = modos('#include <stdio.h>\n\n' + recursiva + '\nint main() {\n  int a = factorial(2);\n  int b = factorial(3);\n\n  printf("%d %d\\n", a, b);\n\n  return 0;\n}');
            const [uno, dos] = r.m.llamadas.filter((x) => x.nivel === 1);
            const delPrimero = r.rep.llamadasDeLaTabla(uno.hasta - 1);
            const delSegundo = r.rep.llamadasDeLaTabla(dos.hasta - 1);
            // (la primera: main y factorial(2), factorial(1); la segunda: main y factorial(3), factorial(2), factorial(1); si se acumularan, siete)
            if (delPrimero.join(' | ') !== 'main | factorial(2) | factorial(1)') throw new Error('la primera recursion: ' + delPrimero.join(' | '));
            if (delSegundo.join(' | ') !== 'main | factorial(3) | factorial(2) | factorial(1)') throw new Error('la segunda recursion no arrastra las filas de la primera: ' + delSegundo.join(' | '));
            // una recursion que no devuelve nada (cambia un arreglo): no hay tabla, solo la figura; la que devuelve un valor, si
            const mixta =
              '#include <stdio.h>\n\nint contar(int n) {\n  if (n == 0) {\n    return 0;\n  }\n\n  return 1 + contar(n - 1);\n}\n\nvoid bajar(int v[], int n) {\n  if (n == 0) {\n    return;\n  }\n\n  v[n - 1] = 0;\n  bajar(v, n - 1);\n}\n\nint main() {\n  int v[3] = {7, 8, 9};\n  int c = contar(2);\n\n  bajar(v, 3);\n  printf("%d\\n", c);\n\n  return 0;\n}';
            r = modos(mixta);
            const conValor = r.m.llamadas.filter((x) => x.funcion === 'contar');
            const sinValor = r.m.llamadas.filter((x) => x.funcion === 'bajar');
            if (!conValor.length || !sinValor.length) throw new Error('el programa mixto tiene las dos recursiones');
            for (let k = conValor[0].desde; k < conValor[0].hasta; k++) if (r.cadena[k] !== 'T') throw new Error('la recursion con valor usa la tabla (paso ' + k + '): ' + r.cadena[k]);
            for (let k = sinValor[0].desde; k < sinValor[0].hasta; k++) if (r.cadena[k] !== 'F') throw new Error('la recursion que no devuelve nada usa la figura (paso ' + k + '): ' + r.cadena[k]);
            r = modos('#include <stdio.h>\n\nvoid mostrar(int n) {\n  if (n == 0) {\n    return;\n  }\n\n  printf("%d ", n);\n  mostrar(n - 1);\n}\n\nint main() {\n  int a = 3;\n\n  mostrar(a);\n\n  return 0;\n}');
            if (!r.cadena.every((x) => x === 'F')) throw new Error('una recursion sin valores nunca usa la tabla: ' + r.cadena.join(','));
            // con la ayuda apagada: solo la figura
            ajustes.fijarPerfil('practica');
            r = modos('#include <stdio.h>\n\n' + recursiva + '\nint main() {\n  int a = 3;\n  int r = factorial(a);\n\n  printf("%d\\n", r);\n\n  return 0;\n}');
            ajustes.fijarPerfil('explicacion');
            if (!r.cadena.every((x) => x === 'F')) throw new Error('sin el trazado solo se ve la figura: ' + r.cadena.join(','));
            anotar(true, titulo);
          } catch (err) {
            (await import('../js/ajustes.js')).ajustes.fijarPerfil('explicacion');
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Las referencias de la figura (el panel «ⓘ»): una entrada por cada tipo de flecha que dibuja la figura, cada una con su muestra, y las
        // que dependen de una ayuda visual dicen cual es y tienen su interruptor.
        {
          const titulo = 'referencias de la figura: cubren todos los tipos de flecha y sus interruptores funcionan';
          try {
            const { FLECHAS, FIGURAS, montarLeyenda } = await import('../js/motor/leyenda.js');
            const { ajustes, AYUDAS } = await import('../js/ajustes.js');
            // cobertura: toda clase de flecha que escribe figura.js (rep-flecha-XXX y los grupos de estado) esta en alguna entrada
            const fuente = await (await fetch('../js/motor/figura.js')).text();
            const usadas = new Set([...fuente.matchAll(/rep-flecha-[a-z]+/g)].map((m) => m[0]));
            for (const g of ['rep-nueva', 'rep-retirada', 'rep-de-liberado']) if (fuente.includes(g)) usadas.add(g);
            for (const ignorada of ['rep-flecha-g', 'rep-flecha-zona']) usadas.delete(ignorada);
            const cubiertas = new Set(FLECHAS.flatMap((e) => e.clases));
            const faltan = [...usadas].filter((c) => !cubiertas.has(c));
            if (faltan.length) throw new Error('la figura dibuja flechas que las referencias no explican (sumar una entrada en FLECHAS de js/motor/leyenda.js): ' + faltan.join(', '));
            for (const e of FLECHAS) if (e.requiere && !AYUDAS.some((a) => a.clave === e.requiere)) throw new Error('la entrada ' + e.id + ' depende de una ayuda que no existe: ' + e.requiere);
            // el panel
            const panel = document.createElement('section');
            const abrir = document.createElement('button');
            panel.hidden = true;
            document.body.append(abrir, panel);
            montarLeyenda(panel, abrir);
            const filas = panel.querySelectorAll('.leyenda-fila');
            if (panel.querySelectorAll('[data-flecha]').length !== FLECHAS.length || panel.querySelectorAll('[data-figura]').length !== FIGURAS.length) throw new Error('el panel no tiene una fila por entrada');
            if ([...filas].some((f) => !f.querySelector('.leyenda-titulo').textContent)) throw new Error('una fila sin titulo');
            for (const e of FLECHAS) {
              const f = panel.querySelector(`[data-flecha="${e.id}"]`);
              if (!f.querySelector('svg path.rep-flecha')) throw new Error('la muestra de ' + e.id + ' no dibuja la flecha');
              if (Boolean(f.querySelector('.leyenda-requiere')) !== Boolean(e.requiere)) throw new Error('el "Requiere" de ' + e.id);
            }
            abrir.click();
            if (panel.hidden) throw new Error('el boton abre el panel');
            // el interruptor de «Punteros sin inicializar»
            const previo = ajustes.valor('punterosSinValor');
            ajustes.fijar('punterosSinValor', false);
            const boton = panel.querySelector('[data-flecha="incierta"] .leyenda-interruptor');
            if (!/desactivada/.test(panel.querySelector('[data-flecha="incierta"] .leyenda-estado').textContent) || boton.textContent !== 'Activar') throw new Error('con la ayuda apagada el panel dice desactivada y ofrece Activar');
            boton.click();
            if (!ajustes.valor('punterosSinValor')) throw new Error('el interruptor del panel enciende la ayuda');
            if (boton.textContent !== 'Desactivar') throw new Error('el panel se actualiza con la ayuda');
            ajustes.fijar('punterosSinValor', previo);
            panel.remove();
            abrir.remove();
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Una flecha de la pila a un elemento de un arreglo de otra caja llega desde arriba, por un carril encima de la fila, y no cruza las demas
        // casillas; la casilla a la que llega queda marcada. Y con la ayuda "Resaltar el indice", antes de resaltar la casilla de un elemento se
        // marca su indice (el numero de debajo).
        {
          const titulo = 'figura: la flecha a un elemento llega desde arriba y se marca el indice antes que la casilla';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            const { tiempo } = await import('../js/motor/tiempo.js');
            ajustes.fijarPerfil('explicacion');
            const fuente = '#include <stdio.h>\n\nvoid poner(int v[], int n) {\n  v[n - 1] = 9;\n}\n\nint main() {\n  int a[4] = {1, 2, 3, 4};\n\n  poner(a, 3);\n\n  return 0;\n}';
            const m = ejecutarMotor(analizador, fuente, { traza: true });
            const lugar = document.createElement('div'); // (en el documento: si no, el navegador no lista las animaciones)
            document.body.append(lugar);
            const figura = new Figura(lugar);
            figura.fijarAyudas(ajustes.todos());
            let sobre = 0;
            let apuntadas = 0;
            let conIndice = false;
            m.traza.forEach((foto, i) => {
              figura.mostrar(foto, i ? m.traza[i - 1] : null, { animar: false });
              for (const f of figura.escena.flechas) {
                if (!f.final || f.final.tipo !== 'pila-sobre') continue;
                sobre++;
                const puntos = figura.rutaPuntos(f, f.final, figura.escena.filas);
                const a = puntos[puntos.length - 2];
                const b = puntos[puntos.length - 1];
                if (Math.abs(a.x - b.x) > 0.5 || !(a.y < b.y)) throw new Error('la flecha tiene que bajar en vertical sobre la casilla: ' + JSON.stringify([a, b]));
                // la bajada es lo que mide la cabeza (menos medio trazo): la base de la cabeza queda a la altura del borde de arriba del carril
                const gruesa = Boolean(f.cambio && !f.retirada) || Boolean(f.retirada) || Boolean(f.recienLiberada && f.muerto);
                const grosor = gruesa ? 3 : 1.6;
                const minima = ((f.cambio && !f.retirada ? 6 : 7) * grosor) - grosor / 2;
                if (b.y - a.y < minima - 0.6) throw new Error('la bajada final (' + (b.y - a.y) + ') tiene que alcanzar a la cabeza (' + minima + ')');
                // el carril horizontal queda encima de la fila (no a la altura de las casillas)
                const antes = puntos[puntos.length - 3];
                if (!(antes.y < b.y) || Math.abs(antes.y - a.y) > 0.5) throw new Error('el carril va encima de la fila: ' + JSON.stringify(puntos));
              }
              apuntadas += figura.escena.svg.querySelectorAll('.rep-celda.rep-apuntada').length;
              if (figura.escena.svg.querySelector('text.rep-indice[data-i]')) conIndice = true;
            });
            if (!sobre) throw new Error('la flecha de v al arreglo de main tiene que llegar desde arriba (pila-sobre)');
            if (!apuntadas) throw new Error('la casilla a la que llega la flecha queda marcada');
            // el indice del elemento tiene su marca (para poder resaltarlo)
            if (!conIndice) throw new Error('los indices llevan data-i');
            // el paso en que se escribe v[2]: con la ayuda, el indice 2 se anima (despues de recorrer la flecha); sin ella, no
            const paso = m.traza.findIndex((f) => (f.escrituras || []).some((e) => e.ruta.length && e.ruta[e.ruta.length - 1] === 2));
            if (paso < 1) throw new Error('no se encontro el paso que escribe v[2]');
            const indicesAnimados = (conAyuda) => {
              ajustes.fijar('resaltarIndice', conAyuda);
              const f = new Figura(lugar);
              f.fijarAyudas(ajustes.todos());
              for (let k = 0; k < paso; k++) f.mostrar(m.traza[k], k ? m.traza[k - 1] : null, { animar: false });
              f.mostrar(m.traza[paso], m.traza[paso - 1], { animar: true, duracion: 1000, flujo: true });
              const animados = [...lugar.querySelectorAll('text.rep-indice')].filter((x) => x.getAnimations && x.getAnimations().length && x.getAttribute('data-i').split('|')[1] === '2').length;
              tiempo.cancelar(f.expansionPendiente);
              if (f.raf) cancelAnimationFrame(f.raf);
              return animados;
            };
            const con = indicesAnimados(true);
            const sin = indicesAnimados(false);
            if (!con) throw new Error('con la ayuda, el indice 2 se marca antes de resaltar la casilla');
            if (sin) throw new Error('sin la ayuda no se marca el indice');
            // un acceso directo (sin puntero) en main: tambien se marca el indice, y la pregunta de una condicion marca el indice y despues el borde
            const directo = ejecutarMotor(
              analizador,
              '#include <stdio.h>\n\nint main() {\n  int a[4] = {1, 2, 3, 4};\n  int i = 2;\n\n  a[i] = 9;\n\n  if (a[i] == 9) {\n    i = 0;\n  }\n\n  return 0;\n}',
              { traza: true, preguntas: true }
            );
            const deIndice2 = () => [...lugar.querySelectorAll('text.rep-indice')].filter((x) => x.getAnimations && x.getAnimations().length && x.getAttribute('data-i').split('|')[1] === '2');
            const hasta = (k, conAyuda) => {
              ajustes.fijar('resaltarIndice', conAyuda);
              const f = new Figura(lugar);
              f.fijarAyudas(ajustes.todos());
              for (let j = 0; j < k; j++) f.mostrar(directo.traza[j], j ? directo.traza[j - 1] : null, { animar: false });
              return f;
            };
            const escribe = directo.traza.findIndex((f) => (f.escrituras || []).some((e) => e.ruta.join('/') === '2'));
            if (escribe < 1) throw new Error('no se encontro el paso que escribe a[i]');
            for (const conAyuda of [true, false]) {
              const f = hasta(escribe, conAyuda);
              f.mostrar(directo.traza[escribe], directo.traza[escribe - 1], { animar: true, duracion: 1000, flujo: true });
              const hay = deIndice2().length;
              // el valor de i se expande antes de marcar el indice (y el indice, antes de la casilla)
              const retrasoDe = (sel) => [...lugar.querySelectorAll(sel)].flatMap((x) => (x.getAnimations ? x.getAnimations() : []).map((a) => Math.round(a.effect.getTiming().delay)));
              const deIndiceRetraso = deIndice2().flatMap((x) => x.getAnimations().map((a) => Math.round(a.effect.getTiming().delay)));
              const deTextos = retrasoDe('text.rep-texto').sort((p, q) => p - q);
              tiempo.cancelar(f.expansionPendiente);
              if (f.raf) cancelAnimationFrame(f.raf);
              if (conAyuda && !hay) throw new Error('a[i] = 9 en main marca el indice 2 antes de la casilla');
              if (conAyuda && !(deTextos.length && deTextos[0] < deIndiceRetraso[0])) throw new Error('i se expande antes de marcar el indice: ' + JSON.stringify({ textos: deTextos, indice: deIndiceRetraso }));
              if (!conAyuda && hay) throw new Error('sin la ayuda, a[i] = 9 no marca el indice');
            }
            // la pregunta de una condicion: bordes en el arreglo entero y en i, sin marcar el indice ni la casilla que resulta
            const pregunta = directo.traza.findIndex((f) => f.pregunta && f.pregunta.texto.includes('a[i]'));
            if (pregunta < 1) throw new Error('no se encontro la pregunta de a[i] == 9');
            const nombres = directo.traza[pregunta].pregunta.celdas.map((c) => directo.traza[pregunta].marcos[0].variables.find((v) => v.id === c.a).nombre + (c.ruta.length ? '/' + c.ruta.join('/') : ''));
            if (nombres.join(',') !== 'a,i') throw new Error('la pregunta resalta el arreglo entero y el indice: ' + nombres.join(','));
            const fp = hasta(pregunta, true);
            fp.mostrar(directo.traza[pregunta], directo.traza[pregunta - 1], { animar: true, duracion: 1000, flujo: false });
            fp.fijarEstado(directo.traza[pregunta], 0, true);
            if (deIndice2().length) throw new Error('la pregunta todavia no marca el indice');
            if (fp.raf) cancelAnimationFrame(fp.raf);
            // al ejecutarla: primero se expande i, despues se marca el indice 2 y despues se expande el valor del elemento
            const respuesta = directo.traza.findIndex((f) => f.condicion && f.condicion.texto.includes('a[i]'));
            if (respuesta < 1) throw new Error('no se encontro la respuesta de a[i] == 9');
            const fr = hasta(respuesta, true);
            fr.mostrar(directo.traza[respuesta], directo.traza[respuesta - 1], { animar: true, duracion: 1000, flujo: true });
            const retrasos = (sel) => [...lugar.querySelectorAll(sel)].flatMap((x) => (x.getAnimations ? x.getAnimations() : []).map((a) => Math.round(a.effect.getTiming().delay)));
            const deI = retrasos('text.rep-texto').sort((p, q) => p - q);
            const indice2 = deIndice2().flatMap((x) => x.getAnimations().map((a) => Math.round(a.effect.getTiming().delay)));
            tiempo.cancelar(fr.expansionPendiente);
            if (fr.raf) cancelAnimationFrame(fr.raf);
            if (!indice2.length) throw new Error('al ejecutar la condicion se marca el indice 2');
            // los textos que se expanden: el de i (antes del indice) y el del elemento (despues)
            if (!(deI.length >= 2 && deI[0] < indice2[0] && deI[deI.length - 1] > indice2[0])) throw new Error('i se expande antes del indice y el elemento despues: ' + JSON.stringify({ expandidos: deI, indice: indice2 }));
            ajustes.fijarPerfil('explicacion');
            lugar.remove();
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Un bloque que se queda sin nadie que lo apunte (*lista = nuevo; deja solo al nodo viejo): su borde y su aviso "inalcanzable" aparecen
        // cuando la flecha termina de irse, no desde el primer cuadro del paso (cuando la flecha todavia lo apunta).
        {
          const titulo = 'figura: "inalcanzable" aparece despues de que la flecha se va del bloque';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            const { tiempo } = await import('../js/motor/tiempo.js');
            ajustes.fijarPerfil('explicacion');
            const fuente = '#include <stdlib.h>\ntypedef struct nodo { int d; struct nodo *sig; } TNodo;\nint main() {\n  TNodo *lista = malloc(sizeof(TNodo));\n  lista->sig = NULL;\n  TNodo *nuevo = malloc(sizeof(TNodo));\n  nuevo->sig = NULL;\n  lista = nuevo;\n  nuevo->sig = lista;\n  return 0;\n}';
            const m = ejecutarMotor(analizador, fuente, { traza: true });
            const lugar = document.createElement('div'); // (en el documento: si no, el navegador no lista las animaciones)
            document.body.append(lugar);
            const figura = new Figura(lugar);
            figura.fijarAyudas(ajustes.todos());
            let visto = null;
            m.traza.forEach((foto, i) => {
              figura.mostrar(foto, i ? m.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: false });
              if (figura.raf) cancelAnimationFrame(figura.raf);
              tiempo.cancelar(figura.expansionPendiente);
              const nuevos = figura.escena.svg.querySelectorAll('.rep-huerfano-nuevo');
              if (nuevos.length && !visto) {
                visto = {
                  i,
                  nuevos: nuevos.length,
                  fijos: figura.escena.svg.querySelectorAll('.rep-bloque.rep-huerfano:not(.rep-huerfano-nuevo)').length,
                  demoras: [...nuevos].flatMap((e) => (e.getAnimations ? e.getAnimations() : []).map((a) => a.effect.getTiming().delay)),
                  texto: [...nuevos].some((e) => /inalcanzable/.test(e.textContent)),
                };
              }
            });
            lugar.remove();
            if (!visto) throw new Error('el nodo viejo tendria que quedar inalcanzable en algun paso');
            if (!visto.texto || visto.nuevos < 2) throw new Error('el borde y el aviso del bloque que se queda solo van marcados como nuevos: ' + JSON.stringify(visto));
            if (visto.fijos) throw new Error('el borde de "inalcanzable" no tiene que estar desde el primer cuadro: ' + JSON.stringify(visto));
            if (!visto.demoras.length || !visto.demoras.every((d) => d > 0)) throw new Error('el borde y el aviso aparecen despues de la flecha (con demora): ' + JSON.stringify(visto));
            // sin animar (o al volver a dibujar el paso) se ve de una vez
            const quieta = new Figura(document.createElement('div'));
            quieta.fijarAyudas(ajustes.todos());
            m.traza.forEach((foto, i) => quieta.mostrar(foto, i ? m.traza[i - 1] : null, { animar: false }));
            if (!quieta.escena.svg.querySelector('.rep-bloque.rep-huerfano')) throw new Error('sin animar, el bloque inalcanzable se ve marcado');
            // p = malloc(...) con p apuntando ya a otro bloque: el bloque recien reservado aparece primero (todavia sin flecha) y no
            // tiene que decir "inalcanzable": va a recibir la flecha en el paso de verdad
            const fuga = ejecutarMotor(analizador, '#include <stdlib.h>\nint main() {\n  int *p = malloc(sizeof(int));\n  *p = 3;\n  p = malloc(sizeof(int));\n  free(p);\n  return 0;\n}', { traza: true });
            const nueva = new Figura(document.createElement('div'));
            nueva.fijarAyudas(ajustes.todos());
            let avisos = null;
            fuga.traza.forEach((foto, i) => {
              nueva.mostrar(foto, i ? fuga.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: true });
              if (nueva.raf) cancelAnimationFrame(nueva.raf);
              tiempo.cancelar(nueva.expansionPendiente);
              if (i && foto.monticulo.length > fuga.traza[i - 1].monticulo.length && fuga.traza[i - 1].monticulo.length && avisos === null) avisos = [...nueva.escena.svg.querySelectorAll('text.rep-aviso')].map((t) => t.textContent);
            });
            if (avisos === null) throw new Error('no se encontro el paso de la segunda reserva');
            if (avisos.includes('inalcanzable')) throw new Error('el bloque recien reservado todavia no esta inalcanzable: ' + avisos.join(','));
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // La figura con animacion (ayudas de Explicacion) en todos los pasos de todos los programas del motor: la flecha que se contrae, la
        // que se desvanece y la casilla que se va se dibujan en varios momentos del tiempo A sin fallar.
        {
          const titulo = 'figura animada: todos los pasos de los programas del motor';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('explicacion');
            for (const caso of CASOS_DEL_MOTOR) {
              const r = ejecutarMotor(analizador, caso.codigo, { entrada: caso.entrada, traza: true, preguntas: true });
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              r.traza.forEach((foto, i) => {
                figura.mostrar(foto, i ? r.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: true });
                if (figura.raf) cancelAnimationFrame(figura.raf);
                for (const k of [0, 0.5, 1]) {
                  figura.animandoA = true;
                  figura.kA = k;
                  figura.pintarFlechas();
                }
                figura.animandoA = false;
                figura.pintarFlechas();
              });
            }
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Los dibujos de memoria de los cuestionarios (dibujo.motor): el programa corre sin error
        // y pasa por la linea en que se quiere ver la memoria.
        for (const s of todas) {
          for (const c of s.consignas.filter((x) => x.dibujo && x.dibujo.motor)) {
            const m = c.dibujo.motor;
            try {
              const r = ejecutarMotor(analizador, m.codigo, { entrada: m.entrada || '', traza: true });
              const llega = r.traza.some((f) => f.linea === m.linea);
              anotar(!r.error && llega, `dibujo de memoria de ${c.id}`, r.error ? r.error.codigo : `el programa no pasa por la línea ${m.linea}`);
              r.traza.forEach((foto, i) => dibujarFotografia(foto, i ? r.traza[i - 1] : null));
            } catch (e) {
              anotar(false, `dibujo de memoria de ${c.id}`, e.stack);
            }
          }
        }

        // El paso a paso de los cuestionarios (pasoAPaso): el programa se puede ejecutar y dibujar en
        // todos sus pasos, tenga o no el error que la consigna quiere mostrar; trae una guia.
        for (const s of todas) {
          for (const c of s.consignas.filter((x) => x.pasoAPaso)) {
            const p = c.pasoAPaso;
            const base = p.codigo != null ? p : c.dibujo && c.dibujo.motor;
            try {
              if (!base || !base.codigo) throw new Error('no hay programa: falta pasoAPaso.codigo o dibujo.motor');
              if (!p.guia) throw new Error('falta la guia');
              const r = ejecutarMotor(analizador, base.codigo, { entrada: p.entrada || base.entrada || '', traza: true });
              if (!r.traza.length) throw new Error('el programa no tiene nada que seguir');
              r.traza.forEach((foto, i) => dibujarFotografia(foto, i ? r.traza[i - 1] : null));
              anotar(Boolean(c.opciones), `paso a paso de ${c.id}`, 'solo los cuestionarios llevan pasoAPaso');
            } catch (e) {
              anotar(false, `paso a paso de ${c.id}`, e.stack);
            }
          }
        }

        // El paso a paso de las consignas de codigo con una funcion recursiva: con la solucion de referencia, el corrector arma un
        // programa con un main que llama a la funcion con el primer caso visible; corre sin error y muestra lo que el caso espera.
        for (const s of todas) {
          s.consignas.forEach((c, i) => {
            if (!c.referencia || !c.requiere || !c.requiere.some((x) => (x.funcion && x.funcion.recursiva) || x.apoyo)) return;
            const titulo = `paso a paso de ${c.id} (con código)`;
            try {
              const previo = llegarHasta(s, i + 1, []);
              const r = corregirPaso(analizador, s, i, previo, c.referencia);
              if (!r.memoria) throw new Error('el corrector no armó el programa para el paso a paso');
              const caso = c.requiere.find((x) => x.ejecuta).ejecuta.casos.find((x) => x.visible && x.llama);
              const m = ejecutarMotor(analizador, r.memoria.fuente, { entrada: '', traza: true });
              if (m.error) throw new Error('el programa dio un error: ' + m.error.codigo);
              if (!m.llamadas.length) throw new Error('no se registró ninguna llamada recursiva');
              const enumeradores = { FALSO: '0', VERDADERO: '1' };
              // (el corrector compara la salida sin los espacios del final: el motor deja el de "3 2 1 ")
              const esperado = caso.salida !== undefined ? caso.salida.trim() : String(enumeradores[caso.devuelve] ?? caso.devuelve);
              const salidaMotor = m.salida.trim();
              if (salidaMotor !== esperado) throw new Error('mostró "' + salidaMotor + '" y el caso espera "' + esperado + '"');
              m.traza.forEach((foto, k) => dibujarFotografia(foto, k ? m.traza[k - 1] : null));
              anotar(true, titulo);
            } catch (e) {
              anotar(false, titulo, e.stack || e.message);
            }
          });
        }

        // El banco de casos del paso a paso: con la consigna aprobada, el corrector ofrece todos los casos con llamada (cada uno con su
        // programa, que corre y muestra lo que el caso espera); antes de aprobar, solo los que el enunciado muestra.
        let propiosProbados = 0;
        for (const s of todas) {
          s.consignas.forEach((c, i) => {
            if (!c.referencia || !c.requiere || !c.requiere.some((x) => (x.funcion && x.funcion.recursiva) || x.apoyo)) return;
            const titulo = `banco de casos de ${c.id}`;
            try {
              const previo = llegarHasta(s, i + 1, []);
              const casos = c.requiere.find((x) => x.ejecuta).ejecuta.casos.filter((x) => x.llama);
              const r = corregirPaso(analizador, s, i, previo, c.referencia);
              const banco = r.memoria?.banco;
              if (!banco || banco.length !== casos.length) throw new Error('el banco tiene ' + (banco ? banco.length : 0) + ' casos y la consigna ' + casos.length);
              if (banco[r.memoria.actual].fuente !== r.memoria.fuente) throw new Error('el caso actual no es el que se ejecuta');
              const enumeradores = { FALSO: '0', VERDADERO: '1' };
              banco.forEach((b, k) => {
                if (!b.llamada) throw new Error('el caso ' + k + ' no tiene llamada');
                const m = ejecutarMotor(analizador, b.fuente, { entrada: '', traza: true });
                if (m.error) throw new Error('el caso "' + b.llamada + '" dio un error: ' + m.error.codigo);
                const esperado = casos[k].salida !== undefined ? casos[k].salida.trim() : String(enumeradores[casos[k].devuelve] ?? casos[k].devuelve);
                if (m.salida.trim() !== esperado) throw new Error('el caso "' + b.llamada + '" mostro "' + m.salida.trim() + '" y espera "' + esperado + '"');
              });
              // Los valores propios (si la funcion recibe solo numeros): con los argumentos del caso que se ejecuta, el programa armado con
              // "cabeza" da lo mismo que ese caso.
              const propios = r.memoria.propios;
              if (propios) {
                if (!propios.parametros.length || !propios.inicial) throw new Error('los valores propios no tienen parametros o caso inicial');
                const argumentos = propios.inicial.slice(propios.inicial.indexOf('(') + 1, propios.inicial.lastIndexOf(')'));
                const llamada = propios.funcion + '(' + argumentos + ')';
                const fuentePropia = propios.cabeza + '  ' + (propios.formato ? 'printf("' + propios.formato + '\\n", ' + llamada + ');' : llamada + ';') + '\n  return 0;\n}\n';
                const propia = ejecutarMotor(analizador, fuentePropia, { entrada: '', traza: true });
                const actual = ejecutarMotor(analizador, r.memoria.fuente, { entrada: '', traza: true });
                if (propia.error || propia.salida !== actual.salida) throw new Error('con los valores propios (' + llamada + ') salio "' + propia.salida + '" y el caso da "' + actual.salida + '"' + (propia.error ? ' / ' + propia.error.codigo : ''));
                propiosProbados++;
              }
              // sin aprobar (una respuesta que no anda), solo el caso que el enunciado muestra: no hay nada que elegir
              if (casos.filter((x) => x.visible).length === 1) {
                const mala = c.referencia.replace(/\breturn\b[^;]*;/g, 'return 0;');
                const rm = corregirPaso(analizador, s, i, previo, mala);
                if (rm.correcto) throw new Error('la respuesta de prueba no deberia aprobar: ' + mala + ' / ' + JSON.stringify(rm.diagnosticos));
                if (rm.memoria?.banco) throw new Error('sin aprobar se ofrecio el banco');
              }
              anotar(true, titulo);
            } catch (e) {
              anotar(false, titulo, e.stack || e.message);
            }
          });
        }

        anotar(propiosProbados > 5, 'valores propios: hay consignas recursivas con parametros numericos', 'se probaron ' + propiosProbados);

        // Las etapas del trazado (ayuda "Avanzar por etapas"): cada paso con animacion en la tabla entrega sus marcas, con nombre y en
        // un orden que no se pisa, y las de una llamada que se abre, un caso base y una respuesta existen.
        {
          const titulo = 'etapas del trazado: las marcas de cada paso';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            const fuente =
              '#include <stdio.h>\nint mayorDigito(int n) {\n  if (n < 10) {\n    return n;\n  }\n  int resto = mayorDigito(n / 10);\n  if (n % 10 > resto) {\n    return n % 10;\n  }\n  return resto;\n}\nint main() {\n  printf("%d\\n", mayorDigito(417));\n  return 0;\n}';
            ajustes.fijarPerfil('explicacion');
            const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true });
            const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, llamadas: m.llamadas });
            const nombres = [];
            m.traza.forEach((f, k) => {
              const marcas = rep.marcasDelTrazado(k, 400);
              for (const x of marcas) {
                if (typeof x.nombre !== 'string' || !x.nombre || !(x.t >= 0)) throw new Error('una marca sin nombre o con un momento que no es: ' + JSON.stringify(x));
                nombres.push(x.nombre);
              }
            });
            const hay = (t) => nombres.some((n) => n.includes(t));
            for (const t of ['La llamada brilla y se abre su fila', 'Se anuncia el caso base', 'La pregunta se responde', 'La llamada se reemplaza por su valor', 'Se agrega lo que devuelve']) {
              if (!hay(t)) throw new Error('ningun paso tiene la etapa "' + t + '"');
            }

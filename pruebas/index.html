<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Pruebas del corrector</title>
    <style>
      body { font: 14px/1.5 Consolas, monospace; margin: 24px; }
      .ok { color: #1a7f37; }
      .falla { color: #cf222e; font-weight: bold; }
      pre { margin: 0 0 0 24px; color: #57606a; }
    </style>
  </head>
  <body>
    <h1>Pruebas del corrector</h1>
    <div id="salida">Cargando el analizador...</div>

    <script type="module">
      import { cargarAnalizador } from '../js/analizador.js';
      import {
        inicio,
        corregirPaso,
        despuesDe,
        capturasPrevias,
        respuestaDeReferencia,
        programaDeOpciones,
      } from '../js/serie.js';
      import { marcasDe, partesDeEnunciado } from '../js/enunciado.js';
      import { CASOS } from './casos.js';

      const salida = document.getElementById('salida');
      const lineas = [];
      let fallas = 0;

      function anotar(bien, texto, detalle) {
        if (!bien) fallas++;
        lineas.push({ bien, texto, detalle });
      }

      
      // Un mensaje bien escrito tiene los acentos graves de a pares y nada raro
      // adentro: un par vacio, o con solo un conector, es un simbolo que se perdio.
      function mensajeBienFormado(mensaje) {
        const partes = mensaje.split('`');
        if (partes.length % 2 === 0) return false;
        return partes.every((p, i) => i % 2 === 0 || !['', 'y', 'o', 'e', 'u'].includes(p.trim()));
      }

      const codigos = (resultado, nivel) =>
        [...new Set(resultado.diagnosticos.filter((d) => d.nivel === nivel).map((d) => d.codigo))].sort();

      try {
        const analizador = await cargarAnalizador();

        // Recorre las consignas anteriores al paso, con las respuestas dadas o
        // las de referencia, y devuelve el avance que dejan.
        function llegarHasta(serie, paso, previas = []) {
          let avance = inicio();
          for (let i = 0; i < paso - 1; i++) {
            const respuesta =
              previas[i] || respuestaDeReferencia(serie.consignas[i], capturasPrevias(serie, i, avance));
            const r = corregirPaso(analizador, serie, i, avance, respuesta);
            if (!r.correcto) {
              throw new Error(`la respuesta previa ${i + 1} no pasa: ${codigos(r, 'error')}`);
            }
            avance = despuesDe(serie, i, avance, respuesta, r);
          }
          return avance;
        }

        // Todas las series del indice: que se lean, que no repitan nombres y
        // que cada referencia pase su propia consigna.
        const indice = await (await fetch('../consignas/indice.json')).json();
        const todas = [];
        const vistos = new Set();
        const unico = (id, que) => {
          anotar(id && !vistos.has(id), `${que} con id propio: ${id}`, 'falta el id o está repetido');
          vistos.add(id);
        };
        // Los grupos: con titulo y descripcion, y cada serie en uno solo.
        const enGrupos = new Set();
        const gruposVistos = new Set();
        for (const g of indice.grupos) {
          anotar(
            Boolean(g.id && g.titulo && g.descripcion) && !gruposVistos.has(g.id),
            `grupo con id, título y descripción propios: ${g.id}`,
            'falta algo o el id está repetido'
          );
          gruposVistos.add(g.id);
          for (const archivo of g.series) {
            anotar(!enGrupos.has(archivo), `serie en un solo grupo: ${archivo}`, 'está en más de un grupo');
            enGrupos.add(archivo);
          }
        }
        for (const archivo of indice.grupos.flatMap((g) => g.series)) {
          try {
            const leida = await (await fetch('../consignas/' + archivo)).json();
            unico(leida.id, 'serie');
            leida.consignas.forEach((c) => unico(c.id, 'consigna'));
            todas.push(leida);
          } catch (e) {
            anotar(false, `se lee ${archivo}`, e.message);
          }
        }

        const referencias = todas.flatMap((s) => s.consignas.map((consigna, i) => ({ s, consigna, i })));
        referencias.forEach(({ s, consigna, i }) => {
          try {
            const previo = llegarHasta(s, i + 1);
            const recibidas = capturasPrevias(s, i, previo);

            // Una consigna de opciones: una sola correcta, y cada equivocada
            // con su codigo y su explicacion. Y lo que nombra tiene que existir.
            if (consigna.opciones) {
              const correctas = consigna.opciones.filter((o) => o.correcta).length;
              const sinExplicar = consigna.opciones.filter((o) => !o.explicacion || (!o.correcta && !o.codigo));
              anotar(
                correctas === 1 && sinExplicar.length === 0 && consigna.opciones.length >= 2,
                `opciones de ${consigna.id}`,
                `${correctas} correctas; ${sinExplicar.length} opciones sin explicacion (o equivocadas sin codigo)`
              );
              const textos = [
                consigna.enunciado,
                consigna.codigo || '',
                ...consigna.opciones.flatMap((o) => [o.valor || '', o.texto, o.explicacion || '']),
              ];
              const sueltas = [...new Set(textos.flatMap(marcasDe))].filter((m) => !recibidas[m]);
              anotar(
                !sueltas.length,
                `cuestionario ${consigna.id}: nombres capturados`,
                `usa ${sueltas.map((m) => `{${m}}`).join(', ')}, que ninguna consigna anterior captura`
              );
              // El codigo se ve como un programa completo, con su main y su return.
              const programa = programaDeOpciones(s, i, previo);
              anotar(
                consigna.codigo == null || (/int main\(\) \{/.test(programa) && /return 0;/.test(programa)),
                `programa de ${consigna.id}`,
                programa
              );
              const r = corregirPaso(analizador, s, i, previo, respuestaDeReferencia(consigna));
              anotar(r.correcto, `respuesta correcta de ${consigna.id}`, '');
              return;
            }

            const r = corregirPaso(analizador, s, i, previo, respuestaDeReferencia(consigna, recibidas));
            // La referencia es la respuesta modelo: correcta y sin nada que mejorar.
            anotar(
              r.correcto && !r.mejorable,
              `referencia de ${consigna.id}`,
              [...codigos(r, 'error'), ...codigos(r, 'mejora')].join(', ')
            );

            // Un {X} del enunciado tiene que haberlo capturado una consigna anterior.
            // Solo cuentan las capturas que la consigna recibe: si no continua,
            // un {S} no tiene de donde salir.
            const sueltas = marcasDe(consigna.enunciado).filter((marca) => !recibidas[marca]);
            if (marcasDe(consigna.enunciado).length) {
              anotar(
                !sueltas.length,
                `enunciado de ${consigna.id}: nombres capturados`,
                `usa ${sueltas.map((m) => `{${m}}`).join(', ')}, que ninguna consigna anterior captura`
              );
            }
          } catch (e) {
            anotar(false, `referencia de ${consigna.id}`, e.message);
          }
        });

        // El enunciado muestra el nombre solo, venga de una etiqueta o de un alias.
        const armado = (enunciado, capturas) =>
          partesDeEnunciado(enunciado, capturas)
            .map((p) => p.nombre ?? p.texto)
            .join('');
        const ENUNCIADOS = [
          ['la estructura {S}.', { S: 'struct Alumno' }, 'la estructura Alumno.'],
          ['la estructura {S}.', { S: 'Alumno' }, 'la estructura Alumno.'],
          ['{S} y su alias {A}', { S: 'struct Local', A: 'TLocal' }, 'Local y su alias TLocal'],
          ['sin capturar: {X}', { S: 'struct Local' }, 'sin capturar: {X}'],
        ];
        for (const [enunciado, capturas, esperado] of ENUNCIADOS) {
          const salio = armado(enunciado, capturas);
          anotar(salio === esperado, `enunciado: "${enunciado}"`, `esperaba "${esperado}"\nsalió   "${salio}"`);
        }

        for (const caso of CASOS) {
          const deSerie = caso.serie || 'estructuras';
          const titulo = `${deSerie}, paso ${caso.paso}: ${caso.nombre}`;
          try {
            const serie = todas.find((s) => s.id === deSerie);
            if (!serie) throw new Error(`no hay ninguna serie "${deSerie}" en el índice`);
            const previo = llegarHasta(serie, caso.paso, caso.previas);
            const r = corregirPaso(analizador, serie, caso.paso - 1, previo, caso.respuesta);
            const errores = codigos(r, 'error');
            const esperados = caso.espera === 'ok' ? [] : [...caso.espera].sort();
            const avisos = codigos(r, 'aviso');
            const mejoras = codigos(r, 'mejora');
            const notas = codigos(r, 'nota');
            const mensajesBien = r.diagnosticos.every((d) => mensajeBienFormado(d.mensaje));
            const bien =
              mensajesBien &&
              errores.join() === esperados.join() &&
              (caso.avisos || []).every((a) => avisos.includes(a)) &&
              (!caso.mejoras || mejoras.join() === [...caso.mejoras].sort().join()) &&
              (caso.notas == null || notas.join() === [...caso.notas].sort().join()) &&
              (caso.sinVerificar == null || Boolean(r.sinVerificar) === caso.sinVerificar) &&
              (caso.dice || []).every((t) => r.diagnosticos.some((d) => d.mensaje.includes(t))) &&
              (caso.bloques == null ||
                r.diagnosticos.some((d) => d.bloques && d.bloques.map((b) => b.lineas.join("\n")).join("|") === caso.bloques.join("|")));
            anotar(
              bien,
              titulo,
              bien
                ? ''
                : `esperaba [${esperados}] ${caso.avisos || ''} mejoras [${caso.mejoras ?? 'cualquiera'}]\n` +
                    `salió   [${errores}] avisos [${avisos}] mejoras [${mejoras}]\n` +
                    r.diagnosticos.map((d) => `  línea ${d.linea}: ${d.mensaje}`).join('\n')
            );
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }
      } catch (e) {
        anotar(false, 'no se pudo arrancar', e.stack || e.message);
      }

      salida.textContent = '';
      for (const l of lineas) {
        const p = document.createElement('div');
        p.className = l.bien ? 'ok' : 'falla';
        p.textContent = (l.bien ? 'OK     ' : 'FALLA  ') + l.texto;
        salida.appendChild(p);
        if (l.detalle && !l.bien) {
          const pre = document.createElement('pre');
          pre.textContent = l.detalle;
          salida.appendChild(pre);
        }
      }
      const resumen = document.createElement('h2');
      resumen.className = fallas ? 'falla' : 'ok';
      resumen.textContent = fallas ? `${fallas} de ${lineas.length} fallaron` : `Las ${lineas.length} pasaron`;
      salida.appendChild(resumen);
      window.resultadoPruebas = { total: lineas.length, fallas, lineas };
    </script>
  </body>
</html>

            if (!visto.demoras.length || !visto.demoras.every((d) => d > 0)) throw new Error('el borde y el aviso aparecen despues de la flecha (con demora): ' + JSON.stringify(visto));
            // sin animar (o al volver a dibujar el paso) se ve de una vez
            const quieta = new Figura(document.createElement('div'));
            quieta.fijarAyudas(ajustes.todos());
            m.traza.forEach((foto, i) => quieta.mostrar(foto, i ? m.traza[i - 1] : null, { animar: false }));
            if (!quieta.escena.svg.querySelector('.rep-bloque.rep-huerfano')) throw new Error('sin animar, el bloque inalcanzable se ve marcado');
            // p = malloc(...) con p apuntando ya a otro bloque: el bloque recien reservado aparece primero (todavia sin flecha) y no
            // tiene que decir "inalcanzable": va a recibir la flecha en el paso de verdad
            const fuga = ejecutarMotor(analizador, '#include <stdlib.h>\nint main() {\n  int *p = malloc(sizeof(int));\n  *p = 3;\n  p = malloc(sizeof(int));\n  free(p);\n  return 0;\n}', { traza: true });
            const nueva = new Figura(document.createElement('div'));
            nueva.fijarAyudas(ajustes.todos());
            let avisos = null;
            fuga.traza.forEach((foto, i) => {
              nueva.mostrar(foto, i ? fuga.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: true });
              if (nueva.raf) cancelAnimationFrame(nueva.raf);
              tiempo.cancelar(nueva.expansionPendiente);
              if (i && foto.monticulo.length > fuga.traza[i - 1].monticulo.length && fuga.traza[i - 1].monticulo.length && avisos === null) avisos = [...nueva.escena.svg.querySelectorAll('text.rep-aviso')].map((t) => t.textContent);
            });
            if (avisos === null) throw new Error('no se encontro el paso de la segunda reserva');
            if (avisos.includes('inalcanzable')) throw new Error('el bloque recien reservado todavia no esta inalcanzable: ' + avisos.join(','));
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // La figura con animacion (ayudas de Explicacion) en todos los pasos de todos los programas del motor: la flecha que se contrae, la
        // que se desvanece y la casilla que se va se dibujan en varios momentos del tiempo A sin fallar.
        {
          const titulo = 'figura animada: todos los pasos de los programas del motor';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const { ajustes } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('explicacion');
            for (const caso of CASOS_DEL_MOTOR) {
              const r = ejecutarMotor(analizador, caso.codigo, { entrada: caso.entrada, traza: true, preguntas: true });
              const figura = new Figura(document.createElement('div'));
              figura.fijarAyudas(ajustes.todos());
              r.traza.forEach((foto, i) => {
                figura.mostrar(foto, i ? r.traza[i - 1] : null, { animar: Boolean(i), duracion: 1000, flujo: true });
                if (figura.raf) cancelAnimationFrame(figura.raf);
                for (const k of [0, 0.5, 1]) {
                  figura.animandoA = true;
                  figura.kA = k;
                  figura.pintarFlechas();
                }
                figura.animandoA = false;
                figura.pintarFlechas();
              });
            }
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Los dibujos de memoria de los cuestionarios (dibujo.motor): el programa corre sin error
        // y pasa por la linea en que se quiere ver la memoria.
        for (const s of todas) {
          for (const c of s.consignas.filter((x) => x.dibujo && x.dibujo.motor)) {
            const m = c.dibujo.motor;
            try {
              const r = ejecutarMotor(analizador, m.codigo, { entrada: m.entrada || '', traza: true });
              const llega = r.traza.some((f) => f.linea === m.linea);
              anotar(!r.error && llega, `dibujo de memoria de ${c.id}`, r.error ? r.error.codigo : `el programa no pasa por la línea ${m.linea}`);
              r.traza.forEach((foto, i) => dibujarFotografia(foto, i ? r.traza[i - 1] : null));
            } catch (e) {
              anotar(false, `dibujo de memoria de ${c.id}`, e.stack);
            }
          }
        }

        // El paso a paso de los cuestionarios (pasoAPaso): el programa se puede ejecutar y dibujar en
        // todos sus pasos, tenga o no el error que la consigna quiere mostrar; trae una guia.
        for (const s of todas) {
          for (const c of s.consignas.filter((x) => x.pasoAPaso)) {
            const p = c.pasoAPaso;
            const base = p.codigo != null ? p : c.dibujo && c.dibujo.motor;
            try {
              if (!base || !base.codigo) throw new Error('no hay programa: falta pasoAPaso.codigo o dibujo.motor');
              if (!p.guia) throw new Error('falta la guia');
              const r = ejecutarMotor(analizador, base.codigo, { entrada: p.entrada || base.entrada || '', traza: true });
              if (!r.traza.length) throw new Error('el programa no tiene nada que seguir');
              r.traza.forEach((foto, i) => dibujarFotografia(foto, i ? r.traza[i - 1] : null));
              anotar(Boolean(c.opciones), `paso a paso de ${c.id}`, 'solo los cuestionarios llevan pasoAPaso');
            } catch (e) {
              anotar(false, `paso a paso de ${c.id}`, e.stack);
            }
          }
        }

        // El paso a paso de las consignas de codigo con una funcion recursiva: con la solucion de referencia, el corrector arma un
        // programa con un main que llama a la funcion con el primer caso visible; corre sin error y muestra lo que el caso espera.
        for (const s of todas) {
          s.consignas.forEach((c, i) => {
            if (!c.referencia || !c.requiere || !c.requiere.some((x) => (x.funcion && x.funcion.recursiva) || x.apoyo)) return;
            const titulo = `paso a paso de ${c.id} (con código)`;
            try {
              const previo = llegarHasta(s, i + 1, []);
              const r = corregirPaso(analizador, s, i, previo, c.referencia);
              if (!r.memoria) throw new Error('el corrector no armó el programa para el paso a paso');
              const caso = c.requiere.find((x) => x.ejecuta).ejecuta.casos.find((x) => x.visible && x.llama);
              const m = ejecutarMotor(analizador, r.memoria.fuente, { entrada: '', traza: true });
              if (m.error) throw new Error('el programa dio un error: ' + m.error.codigo);
              if (!m.llamadas.length) throw new Error('no se registró ninguna llamada recursiva');
              const enumeradores = { FALSO: '0', VERDADERO: '1' };
              // (el corrector compara la salida sin los espacios del final: el motor deja el de "3 2 1 ")
              const esperado = caso.salida !== undefined ? caso.salida.trim() : String(enumeradores[caso.devuelve] ?? caso.devuelve);
              const salidaMotor = m.salida.trim();
              if (salidaMotor !== esperado) throw new Error('mostró "' + salidaMotor + '" y el caso espera "' + esperado + '"');
              m.traza.forEach((foto, k) => dibujarFotografia(foto, k ? m.traza[k - 1] : null));
              anotar(true, titulo);
            } catch (e) {
              anotar(false, titulo, e.stack || e.message);
            }
          });
        }

        // El banco de casos del paso a paso: con la consigna aprobada, el corrector ofrece todos los casos con llamada (cada uno con su
        // programa, que corre y muestra lo que el caso espera); antes de aprobar, solo los que el enunciado muestra.
        let propiosProbados = 0;
        for (const s of todas) {
          s.consignas.forEach((c, i) => {
            if (!c.referencia || !c.requiere || !c.requiere.some((x) => (x.funcion && x.funcion.recursiva) || x.apoyo)) return;
            const titulo = `banco de casos de ${c.id}`;
            try {
              const previo = llegarHasta(s, i + 1, []);
              const casos = c.requiere.find((x) => x.ejecuta).ejecuta.casos.filter((x) => x.llama);
              const r = corregirPaso(analizador, s, i, previo, c.referencia);
              const banco = r.memoria?.banco;
              if (!banco || banco.length !== casos.length) throw new Error('el banco tiene ' + (banco ? banco.length : 0) + ' casos y la consigna ' + casos.length);
              if (banco[r.memoria.actual].fuente !== r.memoria.fuente) throw new Error('el caso actual no es el que se ejecuta');
              const enumeradores = { FALSO: '0', VERDADERO: '1' };
              banco.forEach((b, k) => {
                if (!b.llamada) throw new Error('el caso ' + k + ' no tiene llamada');
                const m = ejecutarMotor(analizador, b.fuente, { entrada: '', traza: true });
                if (m.error) throw new Error('el caso "' + b.llamada + '" dio un error: ' + m.error.codigo);
                const esperado = casos[k].salida !== undefined ? casos[k].salida.trim() : String(enumeradores[casos[k].devuelve] ?? casos[k].devuelve);
                if (m.salida.trim() !== esperado) throw new Error('el caso "' + b.llamada + '" mostro "' + m.salida.trim() + '" y espera "' + esperado + '"');
              });
              // Los valores propios (si la funcion recibe solo numeros): con los argumentos del caso que se ejecuta, el programa armado con
              // "cabeza" da lo mismo que ese caso.
              const propios = r.memoria.propios;
              if (propios) {
                if (!propios.parametros.length || !propios.inicial) throw new Error('los valores propios no tienen parametros o caso inicial');
                const argumentos = propios.inicial.slice(propios.inicial.indexOf('(') + 1, propios.inicial.lastIndexOf(')'));
                const llamada = propios.funcion + '(' + argumentos + ')';
                const fuentePropia = propios.cabeza + '  ' + (propios.formato ? 'printf("' + propios.formato + '\\n", ' + llamada + ');' : llamada + ';') + '\n  return 0;\n}\n';
                const propia = ejecutarMotor(analizador, fuentePropia, { entrada: '', traza: true });
                const actual = ejecutarMotor(analizador, r.memoria.fuente, { entrada: '', traza: true });
                if (propia.error || propia.salida !== actual.salida) throw new Error('con los valores propios (' + llamada + ') salio "' + propia.salida + '" y el caso da "' + actual.salida + '"' + (propia.error ? ' / ' + propia.error.codigo : ''));
                propiosProbados++;
              }
              // sin aprobar (una respuesta que no anda), solo el caso que el enunciado muestra: no hay nada que elegir
              if (casos.filter((x) => x.visible).length === 1) {
                const mala = c.referencia.replace(/\breturn\b[^;]*;/g, 'return 0;');
                const rm = corregirPaso(analizador, s, i, previo, mala);
                if (rm.correcto) throw new Error('la respuesta de prueba no deberia aprobar: ' + mala + ' / ' + JSON.stringify(rm.diagnosticos));
                if (rm.memoria?.banco) throw new Error('sin aprobar se ofrecio el banco');
              }
              anotar(true, titulo);
            } catch (e) {
              anotar(false, titulo, e.stack || e.message);
            }
          });
        }

        anotar(propiosProbados > 5, 'valores propios: hay consignas recursivas con parametros numericos', 'se probaron ' + propiosProbados);

        // La consola del reproductor muestra tambien lo que se tipeo (el eco de cada linea, aparte de la salida) y la entrada es una cinta: en la zona
        // de lectura no hay nada en reposo y lo que falta leer esta a la derecha. Un boton abre la consola completa.
        {
          const titulo = 'reproductor: la consola con el eco de la entrada, la cinta y la ventana de la consola';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            const fuente = '#include <stdio.h>\nint main() {\n  int n;\n  int a;\n  int b;\n  printf("N: ");\n  scanf("%d", &n);\n  printf("Datos: ");\n  scanf("%d", &a);\n  scanf("%d", &b);\n  printf("%d\\n", n + a + b);\n  return 0;\n}';
            ajustes.fijarPerfil('explicacion');
            const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true, entrada: '3\n10 20\n' });
            const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, entrada: m.entrada });
            document.body.append(rep);
            const botones = [...rep.querySelectorAll('button')];
            const final = botones.find((b) => /Final/.test(b.textContent));
            final.click();
            const consola = rep.querySelector('.rep-consola');
            if (consola.textContent !== 'N: 3\nDatos: 10 20\n33\n') throw new Error('la consola dice ' + JSON.stringify(consola.textContent));
            const ecos = [...consola.querySelectorAll('.rep-eco')].map((x) => x.textContent);
            if (ecos.join('|') !== '3\n|10 20\n') throw new Error('los ecos son ' + JSON.stringify(ecos));
            if (rep.querySelector('.rep-cinta-ahora').children.length) throw new Error('en reposo la zona de lectura esta vacia');
            const ventana = rep.querySelector('.rep-consola-ventana');
            if (!ventana.hidden) throw new Error('la ventana de la consola empieza cerrada');
            rep.querySelector('.rep-consola-ampliar').click();
            if (ventana.hidden || ventana.querySelector('.rep-consola-completa').textContent !== consola.textContent) throw new Error('el boton abre la consola completa');
            ventana.querySelector('button').click();
            if (!ventana.hidden) throw new Error('la ventana se cierra');
            // sin entrada, no hay cinta
            const solo = ejecutarMotor(analizador, '#include <stdio.h>\nint main() {\n  printf("hola");\n  return 0;\n}', { traza: true, preguntas: true });
            const sin = crearReproductor({ codigo: 'x', traza: solo.traza, funciones: solo.funciones, entrada: solo.entrada });
            if (sin.querySelector('.rep-cinta')) throw new Error('un programa sin entrada no tiene cinta');
            rep.remove();
            anotar(true, titulo);
          } catch (err) {
            anotar(false, titulo, err.stack || err.message);
          }
        }

        // Las etapas del trazado (ayuda "Avanzar por etapas"): cada paso con animacion en la tabla entrega sus marcas, con nombre y en
        // un orden que no se pisa, y las de una llamada que se abre, un caso base y una respuesta existen.
        {
          const titulo = 'etapas del trazado: las marcas de cada paso';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            const fuente =
              '#include <stdio.h>\nint mayorDigito(int n) {\n  if (n < 10) {\n    return n;\n  }\n  int resto = mayorDigito(n / 10);\n  if (n % 10 > resto) {\n    return n % 10;\n  }\n  return resto;\n}\nint main() {\n  printf("%d\\n", mayorDigito(417));\n  return 0;\n}';
            ajustes.fijarPerfil('explicacion');
            const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true });
            const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, llamadas: m.llamadas });
            const nombres = [];
            m.traza.forEach((f, k) => {
              const marcas = rep.marcasDelTrazado(k, 400);
              for (const x of marcas) {
                if (typeof x.nombre !== 'string' || !x.nombre || !(x.t >= 0)) throw new Error('una marca sin nombre o con un momento que no es: ' + JSON.stringify(x));
                nombres.push(x.nombre);
              }
            });
            const hay = (t) => nombres.some((n) => n.includes(t));
            for (const t of ['La llamada brilla y se abre su fila', 'Se anuncia el caso base', 'La pregunta se responde', 'La llamada se reemplaza por su valor', 'Se agrega lo que devuelve']) {
              if (!hay(t)) throw new Error('ningun paso tiene la etapa "' + t + '"');
            }
            // Con el detalle de las preguntas de la tabla, la respuesta se parte en los estados de la pregunta.
            ajustes.fijar('detalleCondicionesTabla', true);
            const conDetalle = [];
            m.traza.forEach((f, k) => rep.marcasDelTrazado(k, 400).forEach((x) => conDetalle.push(x.nombre)));
            for (const t of ['Se ponen los valores en la pregunta', 'La pregunta se responde']) {
              if (!conDetalle.some((n) => n.includes(t))) throw new Error('con el detalle, ningun paso tiene la etapa "' + t + '"');
            }
            // Con el detalle de la ida, la linea llega tal cual esta en el codigo y, al abrirse la llamada, pasa por sus estados.
            ajustes.fijar('detalleCondicionesTabla', false);
            ajustes.fijar('detalleIda', true);
            const conIda = [];
            m.traza.forEach((f, k) => rep.marcasDelTrazado(k, 400).forEach((x) => conIda.push(x.nombre)));
            for (const t of ['tal cual está en el código', 'Se reemplazan las variables por su valor: resto = mayorDigito(417 / 10)', 'Se resuelven las cuentas: resto = mayorDigito(41)']) {
              if (!conIda.some((n) => n.includes(t))) throw new Error('con el detalle de la ida, ningun paso tiene la etapa "' + t + '"');
            }
            ajustes.fijarPerfil('practica');
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // Los puntos de parada (ayuda "Puntos de parada"): el reproductor sabe a que paso saltar desde cualquiera; con la ayuda apagada no hay.
        {
          const titulo = 'puntos de parada: la parada anterior y la siguiente';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            const fuente = '#include <stdio.h>\nint suma(int n) {\n  if (n == 0) {\n    return 0;\n  }\n  return suma(n - 1) + n;\n}\nint main() {\n  printf("%d\\n", suma(2));\n  return 0;\n}';
            ajustes.fijar('puntosDeParada', true); // (una herramienta de reproduccion: no la fija ningun perfil)
            const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true });
            const pasosDe4 = m.traza.map((f, k) => (f.linea === 4 ? k : -1)).filter((k) => k >= 0);
            if (pasosDe4.length < 2) throw new Error('la linea 4 deberia ejecutarse mas de una vez');
            const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, llamadas: m.llamadas, puntos: new Set([4]) });
            const primero = rep.siguienteParada(-1);
            if (primero !== pasosDe4[0]) throw new Error('la primera parada era ' + primero + ' y la linea 4 empieza en el paso ' + pasosDe4[0]);
            if (rep.siguienteParada(primero) !== pasosDe4[1]) throw new Error('la parada que sigue a la primera no es la segunda vez de la linea');
            if (rep.siguienteParada(pasosDe4[pasosDe4.length - 1]) !== -1) throw new Error('despues de la ultima no tiene que haber parada');
            if (rep.anteriorParada(pasosDe4[1]) !== pasosDe4[0] || rep.anteriorParada(pasosDe4[0]) !== -1) throw new Error('la parada anterior no es la que se espera');
            // el atajo de la recursion: el caso base (la llamada con n == 0)
            const atajo = rep.pasoDelCasoBase();
            const base = Math.min(...m.llamadas.filter((r) => r.base != null).map((r) => r.base));
            if (atajo !== base || base < 0) throw new Error('el atajo del caso base era ' + atajo + ' y el caso base esta en el paso ' + base);
            const sinRecursion = ejecutarMotor(analizador, '#include <stdio.h>\nint main() {\n  printf("hola\\n");\n  return 0;\n}', { traza: true, preguntas: true });
            const repPlano = crearReproductor({ codigo: '#include <stdio.h>\nint main() {\n  printf("hola\\n");\n  return 0;\n}', traza: sinRecursion.traza, funciones: sinRecursion.funciones, llamadas: sinRecursion.llamadas });
            if (repPlano.pasoDelCasoBase() !== -1) throw new Error('un programa sin recursion no tiene atajo');
            ajustes.fijar('puntosDeParada', false);
            if (rep.siguienteParada(-1) !== -1) throw new Error('con la ayuda apagada no hay paradas');
            ajustes.fijarPerfil('practica');
            anotar(true, titulo);
          } catch (e) {
            ajustes.fijar('puntosDeParada', false);
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // Las herramientas de reproduccion (Detener y repetir, puntos de parada, avanzar por etapas) no dependen del perfil: encenderlas no lo
        // vuelve "personalizado" y elegir otro perfil no las toca.
        {
          const titulo = 'herramientas de reproduccion: independientes del perfil';
          try {
            const { ajustes, HERRAMIENTAS, montarHerramientas } = await import('../js/ajustes.js');
            ajustes.fijarPerfil('detallado');
            for (const h of HERRAMIENTAS) ajustes.fijar(h.clave, true);
            if (ajustes.perfil() !== 'detallado') throw new Error('con las herramientas encendidas el perfil dejo de reconocerse: ' + ajustes.perfil());
            ajustes.fijarPerfil('practica');
            if (!HERRAMIENTAS.every((h) => ajustes.valor(h.clave))) throw new Error('cambiar de perfil toco una herramienta');
            const franja = montarHerramientas();
            document.body.append(franja);
            const pulsados = [...franja.querySelectorAll('.rep-tool')].map((b) => b.getAttribute('aria-pressed'));
            if (pulsados.length !== HERRAMIENTAS.length || pulsados.some((p) => p !== 'true')) throw new Error('los botones no muestran lo encendido: ' + pulsados.join());
            franja.querySelector('.rep-tool').click();
            if (ajustes.valor(HERRAMIENTAS[0].clave)) throw new Error('el boton no apago la herramienta');
            franja.remove();
            for (const h of HERRAMIENTAS) ajustes.fijar(h.clave, false);
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // Las etapas de la figura (ayuda "Avanzar por etapas"): los recorridos de las flechas, los punteros que cambian de destino, el
        // free y los argumentos de una llamada tienen su marca, con nombre y en orden.
        {
          const titulo = 'etapas de la figura: recorridos de flechas, cambio de destino, free y argumentos';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const fuente =
              '#include <stdlib.h>\ntypedef struct nodo { int dato; struct nodo *sig; } Nodo;\nvoid agregar(Nodo **lista, int d) {\n  Nodo *n = malloc(sizeof(Nodo));\n  n->dato = d;\n  n->sig = *lista;\n  *lista = n;\n}\nint main() {\n  Nodo *lista = NULL;\n  agregar(&lista, 1);\n  agregar(&lista, 2);\n  free(lista);\n  return 0;\n}';
            const m = ejecutarMotor(analizador, fuente, { traza: true });
            if (m.error) throw new Error('el programa dio un error: ' + m.error.codigo);
            const cont = document.createElement('div');
            document.body.append(cont);
            const dibujo = new Figura(cont, {});
            const nombres = [];
            m.traza.forEach((foto, k) => {
              dibujo.mostrar(foto, k ? m.traza[k - 1] : null, { animar: k > 0, duracion: 400, flujo: k > 0 });
              let antes = -1;
              for (const e of dibujo.etapas) {
                if (typeof e.nombre !== 'string' || !e.nombre || !(e.t >= 0)) throw new Error('una marca sin nombre o con un momento que no es: ' + JSON.stringify(e));
                nombres.push(e.nombre);
                antes = Math.max(antes, e.t);
              }
            });
            cont.remove();
            const hay = (t) => nombres.some((n) => n.includes(t));
            for (const t of ['hasta «lista» de «main»', 'pasa a apuntar a', 'Se libera el bloque', 'Se pasa', 'al parámetro «lista» de «agregar»']) {
              if (!hay(t)) throw new Error('ningun paso tiene la etapa "' + t + '"; hay: ' + [...new Set(nombres)].join(' | '));
            }
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        for (const caso of CASOS_DE_LA_REGLA) {
          const r = resultadoDeLaRegla(analizador, corregir, caso);
          anotar(r.bien, `regla memoria: ${caso.nombre}`, r.detalle);
        }

        for (const caso of CASOS) {
          const deSerie = caso.serie || 'estructuras-alumno';
          const titulo = `${deSerie}, paso ${caso.paso}: ${caso.nombre}`;
          try {
            const serie = todas.find((s) => s.id === deSerie);
            if (!serie) throw new Error(`no hay ninguna serie "${deSerie}" en el índice`);
            const previo = llegarHasta(serie, caso.paso, caso.previas);
            const r = corregirPaso(analizador, serie, caso.paso - 1, previo, caso.respuesta);
            const errores = codigos(r, 'error');
            const esperados = caso.espera === 'ok' ? [] : [...caso.espera].sort();
            const avisos = codigos(r, 'aviso');
            const mejoras = codigos(r, 'mejora');
            const notas = codigos(r, 'nota');
            const mensajesBien = r.diagnosticos.every((d) => mensajeBienFormado(d.mensaje));
            const bien =
              mensajesBien &&
              errores.join() === esperados.join() &&
              (caso.avisos || []).every((a) => avisos.includes(a)) &&
              (!caso.sinAvisos || avisos.length === 0) &&
              (!caso.mejoras || mejoras.join() === [...caso.mejoras].sort().join()) &&
              (caso.notas == null || notas.join() === [...caso.notas].sort().join()) &&
              (caso.sinVerificar == null || Boolean(r.sinVerificar) === caso.sinVerificar) &&
              (caso.dice || []).every((t) => r.diagnosticos.some((d) => d.mensaje.includes(t))) &&
              (caso.bloques == null ||
                r.diagnosticos.some((d) => d.bloques && d.bloques.map((b) => b.lineas.join("\n")).join("|") === caso.bloques.join("|")));
            anotar(
              bien,
              titulo,
              bien
                ? ''
                : `esperaba [${esperados}] ${caso.avisos || ''} mejoras [${caso.mejoras ?? 'cualquiera'}]\n` +
                    `salió   [${errores}] avisos [${avisos}] mejoras [${mejoras}]\n` +
                    r.diagnosticos.map((d) => `  línea ${d.linea}: ${d.mensaje}`).join('\n')
            );
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }
      } catch (e) {
        anotar(false, 'no se pudo arrancar', e.stack || e.message);
      }

      salida.textContent = '';
      for (const l of lineas) {
        const p = document.createElement('div');
        p.className = l.bien ? 'ok' : 'falla';
        p.textContent = (l.bien ? 'OK     ' : 'FALLA  ') + l.texto;
        salida.appendChild(p);
        if (l.detalle && !l.bien) {
          const pre = document.createElement('pre');
          pre.textContent = l.detalle;
          salida.appendChild(pre);
        }
      }
      const resumen = document.createElement('h2');
      resumen.className = fallas ? 'falla' : 'ok';
      resumen.textContent = fallas ? `${fallas} de ${lineas.length} fallaron` : `Las ${lineas.length} pasaron`;
      salida.appendChild(resumen);
      window.resultadoPruebas = { total: lineas.length, fallas, lineas };
    </script>
  </body>
</html>

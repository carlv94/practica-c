            // Con el detalle de las preguntas de la tabla, la respuesta se parte en los estados de la pregunta.
            ajustes.fijar('detalleCondicionesTabla', true);
            const conDetalle = [];
            m.traza.forEach((f, k) => rep.marcasDelTrazado(k, 400).forEach((x) => conDetalle.push(x.nombre)));
            for (const t of ['Se ponen los valores en la pregunta', 'La pregunta se responde']) {
              if (!conDetalle.some((n) => n.includes(t))) throw new Error('con el detalle, ningun paso tiene la etapa "' + t + '"');
            }
            // Con el detalle de la ida, la linea llega tal cual esta en el codigo y, al abrirse la llamada, pasa por sus estados.
            ajustes.fijar('detalleCondicionesTabla', false);
            ajustes.fijar('detalleIda', true);
            const conIda = [];
            m.traza.forEach((f, k) => rep.marcasDelTrazado(k, 400).forEach((x) => conIda.push(x.nombre)));
            for (const t of ['tal cual está en el código', 'Se reemplazan las variables por su valor: resto = mayorDigito(417 / 10)', 'Se resuelven las cuentas: resto = mayorDigito(41)']) {
              if (!conIda.some((n) => n.includes(t))) throw new Error('con el detalle de la ida, ningun paso tiene la etapa "' + t + '"');
            }
            ajustes.fijarPerfil('practica');
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // Los puntos de parada (ayuda "Puntos de parada"): el reproductor sabe a que paso saltar desde cualquiera; con la ayuda apagada no hay.
        {
          const titulo = 'puntos de parada: la parada anterior y la siguiente';
          try {
            const { crearReproductor } = await import('../js/motor/reproductor.js');
            const { ajustes } = await import('../js/ajustes.js');
            const fuente = '#include <stdio.h>\nint suma(int n) {\n  if (n == 0) {\n    return 0;\n  }\n  return suma(n - 1) + n;\n}\nint main() {\n  printf("%d\\n", suma(2));\n  return 0;\n}';
            ajustes.fijarPerfil('explicacion');
            const m = ejecutarMotor(analizador, fuente, { traza: true, preguntas: true });
            const pasosDe4 = m.traza.map((f, k) => (f.linea === 4 ? k : -1)).filter((k) => k >= 0);
            if (pasosDe4.length < 2) throw new Error('la linea 4 deberia ejecutarse mas de una vez');
            const rep = crearReproductor({ codigo: fuente, traza: m.traza, funciones: m.funciones, llamadas: m.llamadas, puntos: new Set([4]) });
            const primero = rep.siguienteParada(-1);
            if (primero !== pasosDe4[0]) throw new Error('la primera parada era ' + primero + ' y la linea 4 empieza en el paso ' + pasosDe4[0]);
            if (rep.siguienteParada(primero) !== pasosDe4[1]) throw new Error('la parada que sigue a la primera no es la segunda vez de la linea');
            if (rep.siguienteParada(pasosDe4[pasosDe4.length - 1]) !== -1) throw new Error('despues de la ultima no tiene que haber parada');
            if (rep.anteriorParada(pasosDe4[1]) !== pasosDe4[0] || rep.anteriorParada(pasosDe4[0]) !== -1) throw new Error('la parada anterior no es la que se espera');
            // el atajo de la recursion: el caso base (la llamada con n == 0)
            const atajo = rep.pasoDelCasoBase();
            const base = Math.min(...m.llamadas.filter((r) => r.base != null).map((r) => r.base));
            if (atajo !== base || base < 0) throw new Error('el atajo del caso base era ' + atajo + ' y el caso base esta en el paso ' + base);
            const sinRecursion = ejecutarMotor(analizador, '#include <stdio.h>\nint main() {\n  printf("hola\\n");\n  return 0;\n}', { traza: true, preguntas: true });
            const repPlano = crearReproductor({ codigo: '#include <stdio.h>\nint main() {\n  printf("hola\\n");\n  return 0;\n}', traza: sinRecursion.traza, funciones: sinRecursion.funciones, llamadas: sinRecursion.llamadas });
            if (repPlano.pasoDelCasoBase() !== -1) throw new Error('un programa sin recursion no tiene atajo');
            ajustes.fijar('puntosDeParada', false);
            if (rep.siguienteParada(-1) !== -1) throw new Error('con la ayuda apagada no hay paradas');
            ajustes.fijarPerfil('practica');
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        // Las etapas de la figura (ayuda "Avanzar por etapas"): los recorridos de las flechas, los punteros que cambian de destino, el
        // free y los argumentos de una llamada tienen su marca, con nombre y en orden.
        {
          const titulo = 'etapas de la figura: recorridos de flechas, cambio de destino, free y argumentos';
          try {
            const { Figura } = await import('../js/motor/figura.js');
            const fuente =
              '#include <stdlib.h>\ntypedef struct nodo { int dato; struct nodo *sig; } Nodo;\nvoid agregar(Nodo **lista, int d) {\n  Nodo *n = malloc(sizeof(Nodo));\n  n->dato = d;\n  n->sig = *lista;\n  *lista = n;\n}\nint main() {\n  Nodo *lista = NULL;\n  agregar(&lista, 1);\n  agregar(&lista, 2);\n  free(lista);\n  return 0;\n}';
            const m = ejecutarMotor(analizador, fuente, { traza: true });
            if (m.error) throw new Error('el programa dio un error: ' + m.error.codigo);
            const cont = document.createElement('div');
            document.body.append(cont);
            const dibujo = new Figura(cont, {});
            const nombres = [];
            m.traza.forEach((foto, k) => {
              dibujo.mostrar(foto, k ? m.traza[k - 1] : null, { animar: k > 0, duracion: 400, flujo: k > 0 });
              let antes = -1;
              for (const e of dibujo.etapas) {
                if (typeof e.nombre !== 'string' || !e.nombre || !(e.t >= 0)) throw new Error('una marca sin nombre o con un momento que no es: ' + JSON.stringify(e));
                nombres.push(e.nombre);
                antes = Math.max(antes, e.t);
              }
            });
            cont.remove();
            const hay = (t) => nombres.some((n) => n.includes(t));
            for (const t of ['hasta «lista» de «main»', 'pasa a apuntar a', 'Se libera el bloque', 'Se pasa', 'al parámetro «lista» de «agregar»']) {
              if (!hay(t)) throw new Error('ningun paso tiene la etapa "' + t + '"; hay: ' + [...new Set(nombres)].join(' | '));
            }
            anotar(true, titulo);
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }

        for (const caso of CASOS_DE_LA_REGLA) {
          const r = resultadoDeLaRegla(analizador, corregir, caso);
          anotar(r.bien, `regla memoria: ${caso.nombre}`, r.detalle);
        }

        for (const caso of CASOS) {
          const deSerie = caso.serie || 'estructuras-alumno';
          const titulo = `${deSerie}, paso ${caso.paso}: ${caso.nombre}`;
          try {
            const serie = todas.find((s) => s.id === deSerie);
            if (!serie) throw new Error(`no hay ninguna serie "${deSerie}" en el índice`);
            const previo = llegarHasta(serie, caso.paso, caso.previas);
            const r = corregirPaso(analizador, serie, caso.paso - 1, previo, caso.respuesta);
            const errores = codigos(r, 'error');
            const esperados = caso.espera === 'ok' ? [] : [...caso.espera].sort();
            const avisos = codigos(r, 'aviso');
            const mejoras = codigos(r, 'mejora');
            const notas = codigos(r, 'nota');
            const mensajesBien = r.diagnosticos.every((d) => mensajeBienFormado(d.mensaje));
            const bien =
              mensajesBien &&
              errores.join() === esperados.join() &&
              (caso.avisos || []).every((a) => avisos.includes(a)) &&
              (!caso.sinAvisos || avisos.length === 0) &&
              (!caso.mejoras || mejoras.join() === [...caso.mejoras].sort().join()) &&
              (caso.notas == null || notas.join() === [...caso.notas].sort().join()) &&
              (caso.sinVerificar == null || Boolean(r.sinVerificar) === caso.sinVerificar) &&
              (caso.dice || []).every((t) => r.diagnosticos.some((d) => d.mensaje.includes(t))) &&
              (caso.bloques == null ||
                r.diagnosticos.some((d) => d.bloques && d.bloques.map((b) => b.lineas.join("\n")).join("|") === caso.bloques.join("|")));
            anotar(
              bien,
              titulo,
              bien
                ? ''
                : `esperaba [${esperados}] ${caso.avisos || ''} mejoras [${caso.mejoras ?? 'cualquiera'}]\n` +
                    `salió   [${errores}] avisos [${avisos}] mejoras [${mejoras}]\n` +
                    r.diagnosticos.map((d) => `  línea ${d.linea}: ${d.mensaje}`).join('\n')
            );
          } catch (e) {
            anotar(false, titulo, e.stack || e.message);
          }
        }
      } catch (e) {
        anotar(false, 'no se pudo arrancar', e.stack || e.message);
      }

      salida.textContent = '';
      for (const l of lineas) {
        const p = document.createElement('div');
        p.className = l.bien ? 'ok' : 'falla';
        p.textContent = (l.bien ? 'OK     ' : 'FALLA  ') + l.texto;
        salida.appendChild(p);
        if (l.detalle && !l.bien) {
          const pre = document.createElement('pre');
          pre.textContent = l.detalle;
          salida.appendChild(pre);
        }
      }
      const resumen = document.createElement('h2');
      resumen.className = fallas ? 'falla' : 'ok';
      resumen.textContent = fallas ? `${fallas} de ${lineas.length} fallaron` : `Las ${lineas.length} pasaron`;
      salida.appendChild(resumen);
      window.resultadoPruebas = { total: lineas.length, fallas, lineas };
    </script>
  </body>
</html>
